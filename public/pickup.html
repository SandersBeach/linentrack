<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bag Pickup — Sanders Beach Rentals</title>
<style>
  :root {
    --teal: #1D9E75; --teal-light: #E1F5EE; --teal-dark: #0F6E56; --teal-mid: #5DCAA5;
    --coral: #D85A30; --coral-light: #FAECE7; --coral-dark: #993C1D;
    --amber: #854F0B; --amber-light: #FAEEDA;
    --green: #3B6D11; --green-light: #EAF3DE;
    --gray-50: #F7F7F5; --gray-100: #EFEFEC; --gray-200: #D8D8D3;
    --gray-400: #9A9A94; --gray-700: #444441; --gray-900: #1A1A18;
    --radius: 10px; --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }

  .screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: #fff; border: 0.5px solid var(--gray-200); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 400px; position: relative; }
  .logo { font-size: 13px; font-weight: 600; color: var(--gray-400); text-align: center; margin-bottom: 1.5rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .logo span { color: var(--teal); }
  .title { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--gray-400); text-align: center; margin-bottom: 1.75rem; }
  .btn { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: var(--font); }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost { background: var(--gray-100); color: var(--gray-700); margin-top: 10px; }
  .btn-ghost:hover { background: var(--gray-200); }
  .err { color: var(--coral-dark); font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }

  .lang-toggle { display: flex; justify-content: center; gap: 6px; margin-bottom: 1.25rem; }
  .lang-toggle.lang-toggle-pin { position: absolute; top: 14px; right: 14px; margin-bottom: 0; }
  .lang-btn { border: 0.5px solid var(--gray-200); background: #fff; color: var(--gray-700); font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 20px; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
  .lang-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }
  .topbar .lang-toggle { margin-bottom: 0; }

  .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 1.75rem; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gray-200); transition: all 0.15s; }
  .pin-dot.filled { background: var(--teal); border-color: var(--teal); }
  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .num-btn { padding: 16px; border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); background: #fff; font-size: 20px; font-weight: 500; cursor: pointer; font-family: var(--font); transition: all 0.1s; }
  .num-btn:hover { background: var(--gray-50); }
  .num-btn:active { background: var(--gray-100); transform: scale(0.96); }
  .num-btn.del { font-size: 14px; color: var(--gray-400); }

  .scan-screen { min-height: 100vh; background: var(--gray-50); }
  .topbar { background: #fff; border-bottom: 0.5px solid var(--gray-200); padding: 0 1.25rem; display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 10px; }
  .topbar-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-name span { color: var(--teal); }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar-btn { font-size: 12px; color: var(--coral); background: none; border: none; cursor: pointer; padding: 4px 8px; font-family: var(--font); white-space: nowrap; }
  .content { padding: 1.25rem; max-width: 520px; margin: 0 auto; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-400); margin-bottom: 0.75rem; }
  .bag-list { margin-bottom: 1.25rem; }
  .bag-row { background: #fff; border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .bag-row.confirmed { border-color: var(--teal); background: var(--teal-light); }
  .bag-row.error { border-color: var(--coral); background: var(--coral-light); animation: shake 0.4s ease; }
  .bag-home { font-size: 14px; font-weight: 600; flex: 1; }
  .bag-id { font-size: 11px; color: var(--gray-400); font-family: monospace; background: var(--gray-100); padding: 2px 8px; border-radius: 20px; }
  .bag-status { font-size: 12px; font-weight: 600; }
  .status-waiting { color: var(--amber); }
  .status-confirmed { color: var(--teal-dark); }
  .status-out { color: var(--teal-dark); font-size: 11px; font-weight: 500; text-align: right; }
  .scan-box { background: #fff; border: 0.5px solid var(--gray-200); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  input[type=text] { width: 100%; padding: 11px 14px; border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 15px; font-family: var(--font); background: #fff; color: var(--gray-900); outline: none; transition: border 0.15s; }
  input[type=text]:focus { border-color: var(--teal); }
  .hint { font-size: 12px; color: var(--gray-400); margin-top: 6px; }
  .flash { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; z-index: 1002; white-space: nowrap; max-width: 90vw; text-align: center; }
  .flash-ok { background: var(--teal-light); color: var(--teal-dark); border: 0.5px solid var(--teal-mid); }
  .flash-err { background: var(--coral-light); color: var(--coral-dark); border: 0.5px solid var(--coral); }
  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--gray-400); font-size: 14px; }
  .all-done { background: var(--teal-light); border: 0.5px solid var(--teal-mid); border-radius: var(--radius); padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
  .all-done .check { font-size: 40px; margin-bottom: 8px; }
  .all-done .msg { font-size: 16px; font-weight: 600; color: var(--teal-dark); margin-bottom: 4px; }
  .all-done .sub { font-size: 13px; color: var(--gray-700); }
  .wrong-bag-alert { background: var(--coral-light); border: 2px solid var(--coral); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .wrong-bag-alert .wa-title { font-size: 15px; font-weight: 700; color: var(--coral-dark); margin-bottom: 4px; }
  .wrong-bag-alert .wa-sub { font-size: 13px; color: var(--coral-dark); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .anim { animation: slideIn 0.2s ease; }
  .scan-cam-btn { width:100%; padding:13px; border-radius:var(--radius-sm); border:0.5px solid var(--teal-mid); background:var(--teal-light); color:var(--teal-dark); font-size:15px; font-weight:600; cursor:pointer; font-family:var(--font); margin-top:10px; }
  .scan-cam-btn:active { transform: scale(0.98); }
  .cam-overlay { position:fixed; inset:0; background:#000; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .cam-video-wrap { position:relative; width:100%; max-width:480px; aspect-ratio:1/1; overflow:hidden; }
  .cam-video-wrap video { width:100%; height:100%; object-fit:cover; }
  .cam-frame { position:absolute; inset:12%; border:3px solid var(--teal-mid); border-radius:16px; box-shadow:0 0 0 2000px rgba(0,0,0,0.35); pointer-events:none; }
  .cam-status { color:#fff; font-size:15px; text-align:center; padding:1rem 1.25rem; min-height:20px; transition: color 0.15s; }
  .cam-close { position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; z-index:1001; }
</style>
</head>
<body>

<!-- ── PIN Login ── -->
<div id="screen-pin" class="screen" style="background:var(--gray-50)">
  <div class="card">
    <div class="lang-toggle lang-toggle-pin">
      <button class="lang-btn" id="lang-btn-en-pin" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="lang-btn-es-pin" onclick="setLang('es')">ES</button>
    </div>
    <div class="logo">Sanders Beach Rentals · <span>LinenTrack</span></div>
    <div class="title" id="pin-title">Bag Pickup</div>
    <div class="subtitle" id="pin-subtitle">Enter your 5-digit cleaner PIN</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
      <div class="pin-dot" id="pd4"></div>
    </div>
    <div class="numpad">
      <button class="num-btn" onclick="pinPress('1')">1</button>
      <button class="num-btn" onclick="pinPress('2')">2</button>
      <button class="num-btn" onclick="pinPress('3')">3</button>
      <button class="num-btn" onclick="pinPress('4')">4</button>
      <button class="num-btn" onclick="pinPress('5')">5</button>
      <button class="num-btn" onclick="pinPress('6')">6</button>
      <button class="num-btn" onclick="pinPress('7')">7</button>
      <button class="num-btn" onclick="pinPress('8')">8</button>
      <button class="num-btn" onclick="pinPress('9')">9</button>
      <button class="num-btn del" id="pin-clear-btn" onclick="pinClear()">Clear</button>
      <button class="num-btn" onclick="pinPress('0')">0</button>
      <button class="num-btn del" onclick="pinDel()">⌫</button>
    </div>
    <div class="err" id="pin-err"></div>
  </div>
</div>

<!-- ── Scan Screen ── -->
<div id="screen-scan" class="scan-screen" style="display:none">
  <div class="topbar">
    <div class="topbar-name">👋 <span id="cleaner-name-display">Cleaner</span></div>
    <div class="topbar-right">
      <div class="lang-toggle">
        <button class="lang-btn" id="lang-btn-en-scan" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="lang-btn-es-scan" onclick="setLang('es')">ES</button>
      </div>
      <button class="topbar-btn" id="signout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div class="content">
    <div id="wrong-bag-area"></div>
    <div id="all-done-area"></div>
    <div class="scan-box">
      <div class="section-title" id="scan-section-title" style="margin-bottom:8px">Scan a bag to confirm pickup</div>
      <input type="text" id="scan-input" placeholder="Scan bag tag..." autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')processScan()">
      <div class="hint" id="scan-hint">Scanner auto-submits · or press Enter after typing</div>
      <button class="scan-cam-btn" id="cam-scan-btn" onclick="openCameraScan()">📷 Scan with phone camera</button>
    </div>
    <div class="section-title" id="your-bags-title">Your bags ready for pickup</div>
    <div id="bag-list" class="bag-list">
      <div class="empty-state" id="loading-bags-text">Loading your bags...</div>
    </div>
    <div class="section-title" id="bags-out-title">Bags you currently have</div>
    <div id="bags-out-list" class="bag-list">
      <div class="empty-state" id="loading-bags-out-text">Loading...</div>
    </div>
  </div>
</div>

<!-- ── Camera Scan Overlay ── -->
<div id="cam-overlay" class="cam-overlay" style="display:none">
  <button class="cam-close" onclick="closeCameraScan()">✕</button>
  <div class="cam-video-wrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <div class="cam-frame"></div>
  </div>
  <div class="cam-status" id="cam-status">Point your camera at a bag tag QR code</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
// Language resets to English on every fresh page load (not remembered), since
// multiple cleaners share one PIN/phone and each person should pick their own.
let LANG = 'en';

const T = {
  en: {
    pinTitle: 'Bag Pickup',
    pinSubtitle: 'Enter your 5-digit cleaner PIN',
    clear: 'Clear',
    wrongPin: 'Wrong PIN — try again',
    connError: 'Connection error',
    signOut: 'Sign out',
    scanSectionTitle: 'Scan a bag to confirm pickup',
    scanPlaceholder: 'Scan bag tag...',
    scanHint: 'Scanner auto-submits · or press Enter after typing',
    camBtn: '📷 Scan with phone camera',
    yourBagsTitle: 'Your bags ready for pickup',
    loadingBags: 'Loading your bags...',
    errorLoadingBags: 'Error loading bags',
    confirmed: '✓ Confirmed',
    waiting: '⏳ Waiting',
    allDoneMsg: 'All bags confirmed!',
    allDoneSub: "You're good to go. Your 24-hour return window starts now.",
    noBags: 'No bags are staged for you right now.<br>Check with the linen attendant.',
    alreadyConfirmed: 'Already confirmed!',
    bagConfirmed: (home) => `✓ ${home} confirmed!`,
    wrongBagTitle: '🚨 Wrong bag!',
    wrongBagSub: (id, name) => `<strong>${id}</strong> belongs to ${name}. Please put it back where you found it.`,
    wrongBagPlain: (id, name) => `Wrong bag — ${id} belongs to ${name}. Put it back.`,
    notYours: '⚠️ That bag is not yours!',
    genericError: 'Error — try again',
    camPrompt: 'Point your camera at a bag tag QR code',
    camLibFail: 'Scanner library failed to load — check your internet connection and try again, or use manual entry.',
    camNoAccess: 'Could not access camera — check camera permission for this browser.',
    camDetected: '✓ Code detected...',
    defaultCleanerName: 'Cleaner',
    bagsOutTitle: 'Bags you currently have',
    noBagsOut: "You don't have any bags checked out right now.",
    loadingBagsOut: 'Loading...',
    pickedUpLabel: 'Picked up',
    serverErrors: {
      'Bag not found': 'Bag not found',
      'Already staged or checked out': 'Already staged or checked out',
      'This bag has not been staged yet': 'This bag has not been staged yet',
      'Already picked up': 'Already picked up',
      'Invalid PIN': 'Invalid PIN',
      'PIN required': 'PIN required'
    }
  },
  es: {
    pinTitle: 'Recoger bolsas',
    pinSubtitle: 'Ingresa tu PIN de 5 dígitos',
    clear: 'Borrar',
    wrongPin: 'PIN incorrecto — inténtalo de nuevo',
    connError: 'Error de conexión',
    signOut: 'Cerrar sesión',
    scanSectionTitle: 'Escanea una bolsa para confirmar la recogida',
    scanPlaceholder: 'Escanea la etiqueta de la bolsa...',
    scanHint: 'El escáner envía automáticamente · o presiona Enter después de escribir',
    camBtn: '📷 Escanear con la cámara del teléfono',
    yourBagsTitle: 'Tus bolsas listas para recoger',
    loadingBags: 'Cargando tus bolsas...',
    errorLoadingBags: 'Error al cargar las bolsas',
    confirmed: '✓ Confirmada',
    waiting: '⏳ Esperando',
    allDoneMsg: '¡Todas las bolsas confirmadas!',
    allDoneSub: 'Todo listo. Tu plazo de devolución de 24 horas comienza ahora.',
    noBags: 'No tienes bolsas asignadas en este momento.<br>Consulta con el encargado de blancos.',
    alreadyConfirmed: '¡Ya confirmada!',
    bagConfirmed: (home) => `✓ ¡${home} confirmada!`,
    wrongBagTitle: '🚨 ¡Bolsa equivocada!',
    wrongBagSub: (id, name) => `<strong>${id}</strong> pertenece a ${name}. Por favor devuélvela a donde la encontraste.`,
    wrongBagPlain: (id, name) => `Bolsa equivocada — ${id} pertenece a ${name}. Devuélvela.`,
    notYours: '⚠️ ¡Esa bolsa no es tuya!',
    genericError: 'Error — inténtalo de nuevo',
    camPrompt: 'Apunta tu cámara al código QR de la etiqueta de la bolsa',
    camLibFail: 'No se pudo cargar el escáner — revisa tu conexión a internet e inténtalo de nuevo, o ingresa el código manualmente.',
    camNoAccess: 'No se pudo acceder a la cámara — revisa el permiso de cámara para este navegador.',
    camDetected: '✓ Código detectado...',
    defaultCleanerName: 'Limpiador/a',
    bagsOutTitle: 'Bolsas que tienes actualmente',
    noBagsOut: 'No tienes bolsas contigo en este momento.',
    loadingBagsOut: 'Cargando...',
    pickedUpLabel: 'Recogida',
    serverErrors: {
      'Bag not found': 'Bolsa no encontrada',
      'Already staged or checked out': 'Ya está preparada o entregada',
      'This bag has not been staged yet': 'Esta bolsa aún no ha sido preparada',
      'Already picked up': 'Ya fue recogida',
      'Invalid PIN': 'PIN inválido',
      'PIN required': 'Se requiere el PIN'
    }
  }
};

function t() { return T[LANG]; }

function translateServerError(msg) {
  if (!msg) return t().genericError;
  return t().serverErrors[msg] || msg;
}

function setLang(lang) {
  LANG = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('lang-btn-' + lang + '-pin')?.classList.add('active');
  document.getElementById('lang-btn-' + lang + '-scan')?.classList.add('active');
  applyStaticText();
  if (document.getElementById('screen-scan').style.display !== 'none') {
    renderBagList();
    renderBagsOutList();
  }
}

function applyStaticText() {
  const tr = t();
  document.getElementById('pin-title').textContent = tr.pinTitle;
  document.getElementById('pin-subtitle').textContent = tr.pinSubtitle;
  document.getElementById('pin-clear-btn').textContent = tr.clear;
  document.getElementById('signout-btn').textContent = tr.signOut;
  document.getElementById('scan-section-title').textContent = tr.scanSectionTitle;
  document.getElementById('scan-input').placeholder = tr.scanPlaceholder;
  document.getElementById('scan-hint').textContent = tr.scanHint;
  document.getElementById('cam-scan-btn').textContent = tr.camBtn;
  document.getElementById('your-bags-title').textContent = tr.yourBagsTitle;
  document.getElementById('bags-out-title').textContent = tr.bagsOutTitle;
  const loadingEl = document.getElementById('loading-bags-text');
  if (loadingEl) loadingEl.textContent = tr.loadingBags;
  const loadingOutEl = document.getElementById('loading-bags-out-text');
  if (loadingOutEl) loadingOutEl.textContent = tr.loadingBagsOut;
  const camStatus = document.getElementById('cam-status');
  if (camStatus && !_camRunning) camStatus.textContent = tr.camPrompt;
  if (!_cleaner) document.getElementById('cleaner-name-display').textContent = tr.defaultCleanerName;
}

let _pin = '';
let _cleaner = null;
let _stagedBags = [];
let _confirmedIds = new Set();
let _bagsOut = [];

// ── PIN ───────────────────────────────────────────────────────────────────────
function pinPress(d) {
  if (_pin.length >= 5) return;
  _pin += d;
  updateDots();
  if (_pin.length === 5) setTimeout(submitPin, 80);
}
function pinDel() { _pin = _pin.slice(0,-1); updateDots(); }
function pinClear() { _pin = ''; updateDots(); }
function updateDots() {
  for (let i=0;i<5;i++) document.getElementById('pd'+i).classList.toggle('filled', i<_pin.length);
}
async function submitPin() {
  document.getElementById('pin-err').textContent = '';
  try {
    const r = await fetch('/api/cleaner-auth', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin:_pin}) });
    const data = await r.json();
    if (!r.ok || !data.success) {
      document.getElementById('pin-err').textContent = t().wrongPin;
      _pin = ''; updateDots(); return;
    }
    _cleaner = data.cleaner;
    document.getElementById('screen-pin').style.display = 'none';
    document.getElementById('screen-scan').style.display = 'block';
    document.getElementById('cleaner-name-display').textContent = _cleaner.name;
    await Promise.all([loadStagedBags(), loadBagsOut()]);
    focusScan();
  } catch(e) {
    document.getElementById('pin-err').textContent = t().connError;
    _pin = ''; updateDots();
  }
}
function logout() {
  closeCameraScan();
  _pin = ''; _cleaner = null; _stagedBags = []; _confirmedIds = new Set(); _bagsOut = [];
  updateDots();
  document.getElementById('screen-scan').style.display = 'none';
  document.getElementById('screen-pin').style.display = 'flex';
  document.getElementById('pin-err').textContent = '';
  document.getElementById('wrong-bag-area').innerHTML = '';
  document.getElementById('all-done-area').innerHTML = '';
  document.getElementById('cleaner-name-display').textContent = t().defaultCleanerName;
}

// ── Bags ──────────────────────────────────────────────────────────────────────
async function loadStagedBags() {
  try {
    const r = await fetch(`/api/cleaner/${_cleaner.id}/staged-bags`);
    _stagedBags = await r.json();
    renderBagList();
  } catch(e) {
    document.getElementById('bag-list').innerHTML = `<div class="empty-state">${t().errorLoadingBags}</div>`;
  }
}

async function loadBagsOut() {
  try {
    const r = await fetch(`/api/cleaner/${_cleaner.id}/bags-out`);
    _bagsOut = await r.json();
    renderBagsOutList();
  } catch(e) {
    document.getElementById('bags-out-list').innerHTML = `<div class="empty-state">${t().errorLoadingBags}</div>`;
  }
}

function renderBagList() {
  const tr = t();
  const list = document.getElementById('bag-list');
  const allDone = _stagedBags.length > 0 && _stagedBags.every(b => _confirmedIds.has(b.id));

  if (allDone) {
    document.getElementById('all-done-area').innerHTML = `
      <div class="all-done anim">
        <div class="check">✅</div>
        <div class="msg">${tr.allDoneMsg}</div>
        <div class="sub">${tr.allDoneSub}</div>
      </div>`;
    list.innerHTML = '';
    return;
  }

  document.getElementById('all-done-area').innerHTML = '';

  if (!_stagedBags.length) {
    list.innerHTML = `<div class="empty-state">${tr.noBags}</div>`;
    return;
  }

  list.innerHTML = _stagedBags.map(b => {
    const confirmed = _confirmedIds.has(b.id);
    return `<div class="bag-row ${confirmed?'confirmed':''} anim" id="bagrow-${b.id}">
      <div>
        <div class="bag-home">${b.home_name}</div>
        <span class="bag-id">${b.id}</span>
      </div>
      <div class="bag-status ${confirmed?'status-confirmed':'status-waiting'}">
        ${confirmed ? tr.confirmed : tr.waiting}
      </div>
    </div>`;
  }).join('');
}

function renderBagsOutList() {
  const tr = t();
  const list = document.getElementById('bags-out-list');
  if (!_bagsOut.length) {
    list.innerHTML = `<div class="empty-state">${tr.noBagsOut}</div>`;
    return;
  }
  list.innerHTML = _bagsOut.map(b => {
    let since = '';
    if (b.picked_up_at) {
      const d = new Date(b.picked_up_at.replace(' ', 'T'));
      if (!isNaN(d)) {
        since = d.toLocaleString(LANG === 'es' ? 'es-ES' : 'en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
    }
    return `<div class="bag-row anim">
      <div>
        <div class="bag-home">${b.home_name}</div>
        <span class="bag-id">${b.id}</span>
      </div>
      <div class="bag-status status-out">${tr.pickedUpLabel}${since ? ': ' + since : ''}</div>
    </div>`;
  }).join('');
}

function focusScan() { setTimeout(() => document.getElementById('scan-input')?.focus(), 100); }

// ── Camera status helper ─────────────────────────────────────────────────────
let _camStatusResetTimer = null;
function setCamStatus(msg, kind, viaCamera, autoCloseOnErr) {
  if (!viaCamera) return;
  const status = document.getElementById('cam-status');
  if (!status) return;
  status.textContent = msg;
  status.style.color = kind === 'err' ? '#FF7A56' : '#5DCAA5';
  status.style.fontWeight = '700';
  clearTimeout(_camStatusResetTimer);
  const holdTime = kind === 'err' ? 3200 : 1800;
  if (autoCloseOnErr && kind === 'err') {
    setTimeout(() => { if (_camRunning) closeCameraScan(); }, holdTime);
  } else {
    _camStatusResetTimer = setTimeout(() => {
      if (_camRunning) {
        status.style.color = '#fff';
        status.style.fontWeight = 'normal';
        status.textContent = t().camPrompt;
      }
    }, holdTime);
  }
}

async function processScan(viaCamera) {
  const tr = t();
  const input = document.getElementById('scan-input');
  let raw = (input?.value || '').trim();
  input.value = '';

  // Extract bag ID from URL param if scanner reads a QR URL
  let id = raw;
  if (raw.includes('?') || raw.includes('=')) {
    const m = raw.match(/[?&][Bb][Aa][Gg]=([A-Za-z0-9-]+)/);
    if (m) id = m[1].toUpperCase();
    else id = raw.toUpperCase();
  } else {
    id = raw.toUpperCase();
  }
  if (!id) { focusScan(); return; }

  // Check if this bag is in the staged list for this cleaner
  const inList = _stagedBags.find(b => b.id === id);
  if (inList && _confirmedIds.has(id)) {
    showFlash(tr.alreadyConfirmed, 'ok');
    setCamStatus(tr.alreadyConfirmed, 'ok', viaCamera);
    focusScan(); return;
  }

  try {
    const r = await fetch(`/api/bag/${encodeURIComponent(id)}/pickup`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ cleaner_pin: _pin })
    });
    const data = await r.json();

    if (r.ok && data.success) {
      _confirmedIds.add(id);
      document.getElementById('wrong-bag-area').innerHTML = '';
      const msg = tr.bagConfirmed(data.home);
      showFlash(msg, 'ok');
      setCamStatus(msg, 'ok', viaCamera);
      renderBagList();
      loadBagsOut();
    } else if (data.wrong_cleaner) {
      // Wrong cleaner's bag — big on-screen alert
      document.getElementById('wrong-bag-area').innerHTML = `
        <div class="wrong-bag-alert anim">
          <div class="wa-title">${tr.wrongBagTitle}</div>
          <div class="wa-sub">${tr.wrongBagSub(id, data.assigned_to)}</div>
        </div>`;
      showFlash(tr.notYours, 'err');
      if (navigator.vibrate) navigator.vibrate([120,80,120,80,180]);
      // Also surface it right inside the camera view (in red) and auto-close
      // the camera so the on-screen red alert isn't hidden behind it.
      setCamStatus(tr.wrongBagPlain(id, data.assigned_to || ''), 'err', viaCamera, true);
    } else {
      const msg = translateServerError(data.error);
      showFlash(msg, 'err');
      setCamStatus(msg, 'err', viaCamera);
    }
  } catch(e) {
    showFlash(tr.connError, 'err');
    setCamStatus(tr.connError, 'err', viaCamera);
  }
  focusScan();
}

function showFlash(msg, type) {
  const el = document.createElement('div');
  el.className = `flash flash-${type === 'ok' ? 'ok' : 'err'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ── Camera QR Scan ──────────────────────────────────────────────────────────
let _camStream = null;
let _camRunning = false;
let _camCanvas = null;
let _camCtx = null;
let _camLastCode = null;
let _camLastTime = 0;

async function openCameraScan() {
  const tr = t();
  const overlay = document.getElementById('cam-overlay');
  const video = document.getElementById('cam-video');
  const status = document.getElementById('cam-status');
  status.style.color = '#fff';
  status.style.fontWeight = 'normal';
  overlay.style.display = 'flex';
  if (typeof jsQR === 'undefined') {
    status.textContent = tr.camLibFail;
    return;
  }
  status.textContent = tr.camPrompt;
  if (!_camCanvas) { _camCanvas = document.createElement('canvas'); _camCtx = _camCanvas.getContext('2d', { willReadFrequently: true }); }
  try {
    _camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = _camStream;
    await video.play();
    _camRunning = true;
    _camLastCode = null; _camLastTime = 0;
    requestAnimationFrame(camScanLoop);
  } catch (e) {
    status.textContent = tr.camNoAccess;
  }
}

function closeCameraScan() {
  _camRunning = false;
  clearTimeout(_camStatusResetTimer);
  const overlay = document.getElementById('cam-overlay');
  overlay.style.display = 'none';
  if (_camStream) { _camStream.getTracks().forEach(tr => tr.stop()); _camStream = null; }
  focusScan();
}

function camScanLoop() {
  if (!_camRunning) return;
  const video = document.getElementById('cam-video');
  if (video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR !== 'undefined') {
    _camCanvas.width = video.videoWidth;
    _camCanvas.height = video.videoHeight;
    _camCtx.drawImage(video, 0, 0, _camCanvas.width, _camCanvas.height);
    const imgData = _camCtx.getImageData(0, 0, _camCanvas.width, _camCanvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });
    const now = Date.now();
    if (code && code.data && (code.data !== _camLastCode || now - _camLastTime > 2000)) {
      _camLastCode = code.data; _camLastTime = now;
      handleCameraResult(code.data);
    }
  }
  if (_camRunning) requestAnimationFrame(camScanLoop);
}

function handleCameraResult(raw) {
  const status = document.getElementById('cam-status');
  status.style.color = '#fff';
  status.style.fontWeight = 'normal';
  status.textContent = t().camDetected;
  if (navigator.vibrate) navigator.vibrate(80);
  document.getElementById('scan-input').value = raw;
  processScan(true);
}

// Auto-focus scan input when tapping anywhere on scan screen
document.addEventListener('click', e => {
  if (document.getElementById('screen-scan').style.display !== 'none' && !e.target.closest('button, input')) {
    focusScan();
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
setLang('en');
</script>

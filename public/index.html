    <label style="margin-top:0.75rem">Type</label>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-primary" id="co-type-loan" onclick="setCheckoutType('loan')" style="flex:1">📤 On Loan</button>
      <button class="btn btn-ghost" id="co-type-sold" onclick="setCheckoutType('sold_out')" style="flex:1">💰 Sold Out</button>
    </div>

    <div id="co-return-date-row" style="margin-top:0.75rem">
      <label>Expected return date</label>
      <input type="date" id="co-return-date">
    </div>

    <label style="margin-top:0.75rem">Notes (optional)</label>
    <input type="text" id="co-notes" placeholder="Any notes about this checkout">

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-store-checkout').remove()">Cancel</button>
      <button class="btn btn-primary" id="co-submit-btn" onclick="submitStoreCheckout(${item.id})">Confirm Checkout</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  setCheckoutType('loan');
}

let _checkoutType = 'loan';
function setCheckoutType(type) {
  _checkoutType = type;
  document.getElementById('co-type-loan').className = `btn ${type==='loan'?'btn-primary':'btn-ghost'}`;
  document.getElementById('co-type-sold').className = `btn ${type==='sold_out'?'btn-primary':'btn-ghost'}`;
  document.getElementById('co-return-date-row').style.display = type==='loan' ? 'block' : 'none';
}

async function submitStoreCheckout(itemId) {
  const property = document.getElementById('co-property')?.value?.trim();
  const qty = parseInt(document.getElementById('co-qty')?.value || 1);
  const performedBy = _currentStaffName;
  const staffEmail = _currentStaffEmail;
  const returnDate = document.getElementById('co-return-date')?.value;
  const notes = document.getElementById('co-notes')?.value?.trim();

  if (!property) { alert('Please enter a property address.'); return; }
  if (!performedBy) { alert('Could not determine who is logged in — please log out and back in.'); return; }
  if (_checkoutType === 'loan' && !returnDate) { alert('Please set an expected return date.'); return; }

  const btn = document.getElementById('co-submit-btn');
  btn.textContent = 'Submitting...'; btn.disabled = true;

  try {
    const res = await fetch('/api/store/checkout', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        item_id: itemId, quantity: qty, property_address: property,
        performed_by: performedBy, performed_by_email: staffEmail,
        transaction_type: _checkoutType,
        expected_return_date: returnDate || null, notes
      })
    });
    const data = await res.json();
    if (data.error) { alert(data.error); btn.textContent='Confirm Checkout'; btn.disabled=false; return; }
    document.getElementById('modal-store-checkout')?.remove();
    if (_checkoutType === 'sold_out') {
      alert('✅ Checked out as sold out. Accounting has been notified by email.');
    } else {
      alert(`✅ Checked out on loan. Expected return: ${returnDate}`);
    }
    const storeRes = await fetch('/api/store/items');
    _storeItems = await storeRes.json();
    renderStoreCards();
  } catch(e) {
    alert('Connection error.'); btn.textContent='Confirm Checkout'; btn.disabled=false;
  }
}

  body.innerHTML = loans.map(loan => {
    const overdue = loan.expected_return_date && loan.expected_return_date < today;
    return `<div class="card" style="${overdue?'border-color:var(--coral);border-width:1.5px':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:14px;font-weight:600">${loan.item_name}</div>

async function returnLoanItem(txId, itemName) {
  const notes = prompt(`Any notes about the return of "${itemName}"? (optional)`);

    body: JSON.stringify({notes: notes||''})

async function saveStoreItem(itemId) {
  const name = document.getElementById('si-name')?.value?.trim();
  const category = document.getElementById('si-category')?.value;
  const price = parseFloat(document.getElementById('si-price')?.value||0);

  const isEdit = itemId !== null;
  const url = isEdit ? `/api/store/items/${itemId}` : '/api/store/items';
  const body = {pin:_currentPin, name, category, price};
  if (!isEdit) body.quantity = qty;
  const res = await fetch(url, {method:isEdit?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('modal-store-item')?.remove();
  const storeRes = await fetch('/api/store/items');

async function loadForecastStatus() {
  try {

    const hasReservations = s.reservation_count > 0;
    document.getElementById('forecast-status-area').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem">
        <div class="card" style="padding:0.875rem;${hasPackList?'border-color:var(--teal)':'border-color:var(--coral)'}">

          <div style="font-size:14px;font-weight:600;color:${hasPackList?'var(--teal-dark)':'var(--coral-dark)'}">
            ${hasPackList ? `✓ ${s.pack_list_count} properties loaded` : '⚠️ Not loaded'}
          </div>
          ${hasPackList && s.pack_list_updated ? `<div style="font-size:11px;color:var(--gray-400);margin-top:2px">Updated ${new Date(s.pack_list_updated).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>` : ''}
        </div>
        <div class="card" style="padding:0.875rem;${hasReservations?'border-color:var(--teal)':'border-color:var(--coral)'}">
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-400);margin-bottom:4px">Reservations</div>
          <div style="font-size:14px;font-weight:600;color:${hasReservations?'var(--teal-dark)':'var(--coral-dark)'}">
            ${hasReservations ? `✓ ${s.reservation_count} reservations loaded` : '⚠️ Not loaded'}
          </div>
          ${hasReservations && s.date_range ? `<div style="font-size:11px;color:var(--gray-400);margin-top:2px">${s.date_range}</div>` : ''}
        </div>
      </div>`;
    return s;
  } catch(e) {
    document.getElementById('forecast-status-area').innerHTML = '';
    return null;
  }
}

function forecastSubtab(tab) {
  document.querySelectorAll('.subtab').forEach(b=>b.classList.remove('active'));
  document.getElementById('fct-'+tab)?.classList.add('active');
  if (tab === 'run') renderForecastRun();
  else if (tab === 'boxes') renderBoxPacking();
  else if (tab === 'upload') renderForecastUpload();
}

function setForecastRange(days) {
  const from = new Date();
  const to = new Date();
  to.setDate(to.getDate() + days);
  document.getElementById('fc-from').value = from.toISOString().split('T')[0];
  document.getElementById('fc-to').value = to.toISOString().split('T')[0];
}
function clearForecastRange() {
  document.getElementById('fc-from').value = '';
  document.getElementById('fc-to').value = '';
}

async function runForecast() {
  const btn = document.getElementById('run-forecast-btn');
  btn.textContent = 'Calculating...'; btn.disabled = true;

  const from = document.getElementById('fc-from')?.value;
  const to = document.getElementById('fc-to')?.value;
  let url = '/api/forecast/run';
  if (from && to) url += `?from=${from}&to=${to}`;
  else if (from) url += `?from=${from}`;
  else if (to) url += `?to=${to}`;

  try {
    const data = await fetch(url).then(r=>r.json());
    renderForecastResults(data, from, to);
  } catch(e) {
    alert('Error running forecast — please try again.');
  } finally {
    btn.textContent = 'Run Forecast'; btn.disabled = false;
  }
}

function fcDragOver(e, zoneId) {
  e.preventDefault();
  const z = document.getElementById(zoneId);
  if (z) { z.style.borderColor='var(--teal)'; z.style.background='var(--teal-light)'; }
}
function fcDragLeave(zoneId) {
  const z = document.getElementById(zoneId);
  if (z) { z.style.borderColor='var(--gray-200)'; z.style.background=''; }
}
function fcDrop(e, inputId, zoneId, nameId) {
  e.preventDefault();
  fcDragLeave(zoneId);
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const input = document.getElementById(inputId);
  const dt = new DataTransfer();
  dt.items.add(file);
  input.files = dt.files;
  const nameEl = document.getElementById(nameId);
  if (nameEl) nameEl.textContent = '✓ ' + file.name;
  const zone = document.getElementById(zoneId);
  if (zone) { zone.style.borderColor='var(--teal)'; zone.style.borderStyle='solid'; }
}
function fcFileSelected(inputId, nameId) {
  const file = document.getElementById(inputId)?.files[0];
  const nameEl = document.getElementById(nameId);
  if (file && nameEl) nameEl.textContent = '✓ ' + file.name;
}

function triggerPackCelebration(dateLabel) {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#FDE68A', '#FCA5A5', '#93C5FD', '#6EE7B7', '#F9A8D4', '#C4B5FD'];
  const particles = [];
  const bursts = [
    { x: canvas.width * 0.25, y: canvas.height * 0.35 },
    { x: canvas.width * 0.75, y: canvas.height * 0.3 },
    { x: canvas.width * 0.5, y: canvas.height * 0.5 }
  ];
  bursts.forEach((origin, bi) => {
    setTimeout(() => {
      for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        particles.push({
          x: origin.x, y: origin.y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 3 + Math.random() * 4, life: 60 + Math.random() * 30
        });
      }
    }, bi * 200);
  });

  const msg = document.createElement('div');
  msg.textContent = `🎉 All packed for ${dateLabel}! 🎉`;
  msg.style.cssText = 'position:fixed;top:20%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:600;color:var(--teal-dark);background:white;padding:14px 24px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:10000;pointer-events:none;opacity:0;transition:opacity 0.3s;';
  document.body.appendChild(msg);
  requestAnimationFrame(() => { msg.style.opacity = '1'; });

  let frame = 0;
  function animate() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
      ctx.globalAlpha = Math.max(0, p.life / 90);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
    for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
    if (frame < 150) {
      requestAnimationFrame(animate);
    } else {
      canvas.remove();
      msg.style.opacity = '0';
      setTimeout(() => msg.remove(), 400);
    }
  }
  animate();
}

}

let _packListRefreshTimer = null;

async function renderPackList(gen) {
  if (!packListState.date) packListState.date = todayISO();
  const [plRes, clRes, emRes, invRes] = await Promise.all([
    fetch('/api/pack-list?date=' + packListState.date),
    fetch('/api/cleaners'),
    fetch('/api/pack-list/emergency?date=' + packListState.date),
    fetch('/api/inventory-counts/weekly-task-status')
  ]);
  const pl = await plRes.json();
  packListState.cleaners = await clRes.json();
  packListState.properties = pl.properties;
  const emergAdds = await emRes.json();
  const invTask = await invRes.json();
  if (_stale(gen)) return;
  const unacked = emergAdds.filter(e => !e.acked_by.includes(_currentStaffName));
  renderPackListBody(unacked, invTask);

  if (_packListRefreshTimer) clearInterval(_packListRefreshTimer);
  _packListRefreshTimer = setInterval(async () => {
    if (currentTab !== 'pack_list') { clearInterval(_packListRefreshTimer); _packListRefreshTimer = null; return; }
    // Don't refresh out from under someone mid-scan or mid-flag
    const packModalOpen = document.getElementById('modal-pack-cleaner')?.style.display === 'flex';
    const flagModalOpen = document.getElementById('modal-pack-flag')?.style.display === 'flex';
    if (packModalOpen || flagModalOpen) return;

        fetch('/api/pack-list?date=' + packListState.date),
        fetch('/api/pack-list/emergency?date=' + packListState.date),
        fetch('/api/inventory-counts/weekly-task-status')
      ]);

      const emData = await emR.json();
      const invData = await invR.json();
      packListState.properties = plData.properties;
      renderPackListBody(emData.filter(e => !e.acked_by.includes(_currentStaffName)), invData);
    } catch (e) { /* silent — next tick will retry */ }
  }, 30000);

function renderPackListBody(unacked, invTask) {
  const props = packListState.properties;
  const packed = props.filter(p => p.packed).length;
  const total = props.length;
  const pct = total ? Math.round(packed / total * 100) : 0;
  if (total > 0 && packed === total) {
    if (!celebratedDates.has(packListState.date)) {
      celebratedDates.add(packListState.date);

    }

    html += `<div class="card" style="background:#E7F1F2;border-color:#89BBBE">

    html += `<div class="card" style="background:#FEF3C7;border-color:#FCD34D">
      <div class="card-title" style="color:#92400E">⚡ Last-minute additions</div>
      ${unacked.map(e => `<div class="row"><div class="row-main"><div class="row-title">${e.address}</div><div class="row-sub">Added by ${e.added_by} · ${e.added_at}${e.notes?' · '+e.notes:''}</div></div><button class="btn btn-primary btn-sm" onclick="ackEmergency(${e.id})">Acknowledged</button></div>`).join('')}
    </div>`;
  }
  html += `<div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <label style="margin:0">Date</label>
    <input type="date" id="pl-date" value="${packListState.date}" onchange="changePackListDate(this.value)" style="width:auto">
    <span class="badge badge-count">${packed}/${total} packed</span>
    ${total ? `<div style="flex:1;min-width:120px;background:var(--gray-100);border-radius:6px;height:6px;overflow:hidden"><div style="height:100%;background:var(--teal);width:${pct}%"></div></div>` : ''}
  </div>
  <div id="pl-cards"></div>`;
  document.getElementById('main-content').innerHTML = html;
  const cardsEl = document.getElementById('pl-cards');
  if (!props.length) { cardsEl.innerHTML = '<div class="empty">No arrivals scheduled for this date.</div>'; return; }
  cardsEl.innerHTML = props.map(p => {
    const f = p.formula;
    return `<div class="card" style="${p.packed ? 'opacity:0.55;' : ''}${p.is_emergency ? 'border-color:var(--amber);' : ''}">
      ${p.is_emergency ? '<div class="badge badge-warn" style="margin-bottom:6px">⚡ Last-minute add</div>' : ''}
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div>
          <div style="font-weight:600;font-size:14px">${p.property_name}</div>
          ${f ? `<div class="row-sub">${f.king}K · ${f.queen}Q · ${f.twin}T · ${f.towels} towels${f.pool ? ' · ' + f.pool + ' pool' : ''}${userRoles.includes('admin') ? ` · <a href="#" onclick="openEditFormulaModal('${p.address}');return false;" style="color:var(--teal)">✏️ edit</a>` : ''}</div>` : `<div class="row-sub" style="color:var(--coral-dark)">No packing formula on file for this property${userRoles.includes('admin') ? ` — <a href="#" onclick="openAddFormulaModal('${p.property_name}');return false;" style="color:var(--teal)">add one</a>` : ''}</div>`}
        </div>
        <div style="text-align:right">
          ${p.packed
            ? `<div class="badge badge-ok">✓ Packed</div><div class="row-sub">${p.packed_by} · ${p.packed_at} · for ${p.cleaner_name}</div><div class="row-sub">Bags: ${p.staged_bags.join(', ')}</div><button class="btn btn-ghost btn-sm" style="margin-top:4px" onclick="undoPack('${p.address}')">Undo</button>`

async function scanPackBag() {
  const input = document.getElementById('pack-modal-scan');
  const bagId = input.value.trim().toUpperCase();
  input.value = '';
  const errEl = document.getElementById('pack-modal-scan-err');
  errEl.textContent = '';
  if (!bagId) return;
  if (packModalState.scannedBags.includes(bagId)) { errEl.textContent = 'Already scanned.'; return; }
  try {
    const res = await fetch(`/api/bag/${encodeURIComponent(bagId)}`);
    const data = await res.json();
    if (!res.ok) { errEl.textContent = 'Bag not found.'; return; }
    if ((data.home_name || '').toLowerCase().trim() !== packModalState.address.toLowerCase().trim()) {
      errEl.textContent = `That bag belongs to ${data.home_name}, not ${packModalState.address}.`; return;
    }
    if (data.status !== 'in') {
      errEl.textContent = `That bag is already ${data.status === 'staged' ? 'staged' : 'checked out'}.`; return;
    }
    packModalState.scannedBags.push(bagId);
    renderPackModalBagList();
  } catch (e) { errEl.textContent = 'Connection error.'; }
}

  const dest = document.getElementById('pl-alias-dest').value.trim();
  if (!src || !dest) { alert('Enter both names'); return; }
  const res = await fetch('/api/cleaner-aliases', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ breezeway_name: src, cleaner_name: dest, staff_name: _currentStaffName })
  });
  if (res.ok) {
    document.getElementById('pl-alias-src').value = ''; document.getElementById('pl-alias-dest').value = '';
    document.getElementById('pl-alias-msg').textContent = `✓ Mapped "${src}" → "${dest}"`;
    loadCleanerAliases();
  }
}
async function loadCleanerAliases() {
  const res = await fetch('/api/cleaner-aliases');
  const rows = await res.json();
  const el = document.getElementById('pl-alias-list');
  if (!el) return;
  el.innerHTML = rows.length ? rows.map(r => `<div class="row-sub">"${r.breezeway_name}" → <strong>${r.cleaner_name}</strong></div>`).join('') : '<div class="row-sub">No mappings yet.</div>';
}

async function checkPackFormulaMatches() {
  const msg = document.getElementById('pl-match-msg');
  msg.textContent = 'Checking...'; msg.style.color = 'var(--gray-400)';
  try {
    const res = await fetch('/api/pack-list/formula-match-check');
    const data = await res.json();
    let parts = [];
    if (!data.unmatched_formula_count) {
      parts.push(`✓ All ${data.formula_total} formula entries match a home on file.`);
    } else {
      parts.push(`⚠ ${data.unmatched_formula_count} of ${data.formula_total} formula entries don't match any home:<br>` +
        data.unmatched_formula.map(u => `• ${u.property_name} <span style="color:var(--gray-400)">(${u.address})</span>`).join('<br>'));
    }
    if (data.homes_missing_formula_count) {
      parts.push(`<br>⚠ ${data.homes_missing_formula_count} home(s) have no packing formula yet:<br>` +
        data.homes_missing_formula.map(h => `• ${h.name}`).join('<br>'));
    }
    msg.innerHTML = parts.join('<br><br>');
    msg.style.color = (data.unmatched_formula_count || data.homes_missing_formula_count) ? 'var(--coral-dark)' : 'var(--teal-dark)';
  } catch (e) {
    msg.textContent = '✗ Check failed — please try again.'; msg.style.color = 'var(--coral-dark)';
  }
}

async function renderManageFormulas() {
  const data = await fetch('/api/pack-list/formula/all').then(r => r.json());
  _allFormulas = data.formulas;
  _homesWithoutFormula = data.homes_without_formula;
  renderManageFormulasList();
}

let _homesWithoutFormula = [];

function renderManageFormulasList() {
  const el = document.getElementById('manage-formulas-body');
  if (!el) return;
  const q = (document.getElementById('mf-search')?.value || '').toLowerCase().trim();
  const formulas = q ? _allFormulas.filter(f => f.property_name.toLowerCase().includes(q)) : _allFormulas;
  const missing = q ? _homesWithoutFormula.filter(h => h.name.toLowerCase().includes(q)) : _homesWithoutFormula;
  let html = '';
  if (missing.length) {
    html += `<div style="font-size:12px;font-weight:600;color:var(--coral-dark);margin:10px 0 4px">No formula yet (${missing.length})</div>`;
    html += missing.map(h => `<div class="row"><div class="row-main"><div class="row-title">${h.name}</div></div><button class="btn btn-primary btn-sm" onclick="openAddFormulaModal('${h.name}')">+ Add</button></div>`).join('');
  }
  html += `<div style="font-size:12px;font-weight:600;color:var(--gray-700);margin:14px 0 4px">Has a formula (${formulas.length})</div>`;
  html += formulas.length ? formulas.map(f => `<div class="row"><div class="row-main"><div class="row-title">${f.property_name}</div><div class="row-sub">${f.king}K · ${f.queen}Q · ${f.twin}T · ${f.towels} towels${f.pool ? ' · ' + f.pool + ' pool' : ''}</div></div><button class="btn btn-ghost btn-sm" onclick="openEditFormulaModal('${f.address}')">✏️ Edit</button></div>`).join('') : '<div class="empty">No matches.</div>';
  el.innerHTML = html;
}

async function seedPackFormula() {
  if (!confirm('This will load/refresh the per-property packing formula from the master spreadsheet. Continue?')) return;
  const btn = event.target;
  btn.textContent = 'Loading...'; btn.disabled = true;
  try {
    const res = await fetch('/api/pack-list/seed-formula', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: _currentPin }) });
    const data = await res.json();
    if (data.error) { alert(data.error); btn.textContent = 'Load Packing Formula'; btn.disabled = false; return; }
    document.getElementById('seed-formula-msg').textContent = `✓ ${data.upserted} properties loaded.`;
    btn.textContent = 'Load Packing Formula'; btn.disabled = false;
    checkPackFormulaMatches();
  } catch (e) {
    alert('Connection error'); btn.textContent = 'Load Packing Formula'; btn.disabled = false;
  }
}

function getPOFields(prefix) {
  const g = id => document.getElementById(prefix+id)?.value?.trim();
  return {
    employee_name: g('name'), employee_email: g('email'), vendor: g('vendor'),
    amount: g('amount'), category: g('category'), description: g('description'),
    date_needed: g('date'), urgency: g('urgency') || 'Routine'
  };
}
function validatePOFields(f) {
  if (!f.employee_name) { alert('Please enter your name.'); return false; }
  if (!f.employee_email || !f.employee_email.includes('@')) { alert('Please enter a valid email.'); return false; }
  if (!f.vendor) { alert('Please enter a vendor.'); return false; }
  if (!f.amount || isNaN(parseFloat(f.amount))) { alert('Please enter a valid amount.'); return false; }
  if (!f.category) { alert('Please select a category.'); return false; }
  if (!f.description) { alert('Please describe what you need.'); return false; }
  if (!f.date_needed) { alert('Please enter the date needed by.'); return false; }
  return true;
}

<script>
// Staff management functions (appended)
let _pinsVisible = false;

async function togglePinsVisible() {
  _pinsVisible = !_pinsVisible;
  const btn = document.getElementById('toggle-pins-btn');
  if (btn) btn.textContent = _pinsVisible ? '🙈 Hide PINs' : '👁️ Show PINs';
  loadStaffList();
}

async function loadStaffList() {
  const area = document.getElementById('staff-list-area');
  if (!area) return;
  area.innerHTML = 'Loading...';
  let staff;
  if (_pinsVisible) {
    const res = await fetch('/api/staff/reveal', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({admin_pin:_currentPin}) });
    const data = await res.json();
    if (data.error) { alert(data.error); _pinsVisible = false; const btn=document.getElementById('toggle-pins-btn'); if(btn) btn.textContent='👁️ Show PINs'; staff = await fetch('/api/staff').then(r=>r.json()); }
    else { staff = data; }
  } else {
    staff = await fetch('/api/staff').then(r=>r.json());
  }
  if (!staff.length) { area.innerHTML = '<div class="empty">No staff members found. Click Reset to Master List to seed.</div>'; return; }
  const ROLE_LABELS = { admin:'Admin', warehouse:'Warehouse', maintenance:'Maintenance', coordinator:'Coordinator', inspector:'Inspector' };
  const roleOrder = ['admin','warehouse','maintenance','coordinator','inspector'];
  const byRole = {};
  staff.forEach(s => {
    (s.role||'').split(',').map(r=>r.trim()).filter(Boolean).forEach(r => {
      if (!byRole[r]) byRole[r] = [];
      byRole[r].push(s);
    });
  });
  const rolesPresent = roleOrder.filter(r => byRole[r]);
  area.innerHTML = rolesPresent.map(role => `
    <div style="margin-bottom:1rem">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-400);margin-bottom:6px">${ROLE_LABELS[role]||role}</div>
      ${byRole[role].map(s=>{
        const allRoles = (s.role||'').split(',').map(r=>r.trim()).filter(Boolean);
        const otherRoles = allRoles.filter(r=>r!==role);
        return `
        <div class="row" style="align-items:center">
          <div class="row-main">
            <div class="row-title" style="font-size:13px">${s.name} ${!s.active?'<span style="color:var(--coral-dark);font-size:11px">(inactive)</span>':''}${otherRoles.length?` <span class="tag" style="font-size:10px">+ ${otherRoles.map(r=>ROLE_LABELS[r]||r).join(', ')}</span>`:''}</div>
            <div class="row-sub">${s.email||'no email'} · PIN: ${_pinsVisible && s.pin ? `<strong style="font-family:monospace;letter-spacing:2px;color:var(--teal-dark)">${s.pin}</strong>` : '****'}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="showEditStaffModal(${s.id},'${s.name.replace(/'/g,"\\'")}','${s.role}','${s.email||''}',${s.active})">Edit</button>
        </div>`;
      }).join('')}
    </div>`).join('');
}

function roleCheckboxes(selectedRoles) {
  const roles = [
    {v:'warehouse', l:'Warehouse'}, {v:'maintenance', l:'Maintenance'},
    {v:'inspector', l:'Inspector'}, {v:'coordinator', l:'Coordinator'}, {v:'admin', l:'Admin'}
  ];
  return roles.map(r => `<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;margin-bottom:6px;color:var(--gray-900)"><input type="checkbox" class="role-checkbox" value="${r.v}" ${selectedRoles.includes(r.v)?'checked':''} style="width:auto;margin:0"> ${r.l}</label>`).join('');
}
function getCheckedRoles(container) {
  return [...container.querySelectorAll('.role-checkbox:checked')].map(c => c.value);
}

function showAddStaffModal() {
  const modal = document.createElement('div');
  modal.className='modal-overlay'; modal.id='modal-staff';
  modal.innerHTML=`<div class="modal-box" style="max-width:400px">
    <h3>Add Staff Member</h3>
    <label>Full name</label><input type="text" id="sm-name" placeholder="e.g. Jane Smith">
    <label style="margin-top:0.75rem">Roles (select all that apply)</label>
    <div id="sm-roles">${roleCheckboxes([])}</div>
    <label style="margin-top:0.75rem">PIN (4 digits)</label>
    <input type="text" id="sm-pin" maxlength="4" placeholder="e.g. 1234">
    <label style="margin-top:0.75rem">Email (for alerts)</label>
    <input type="email" id="sm-email" placeholder="e.g. jane@sandersbeachrentals.com">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-staff').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddStaff()">Add Staff Member</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function submitAddStaff() {
  const name=document.getElementById('sm-name')?.value?.trim();
  const roles=getCheckedRoles(document.getElementById('sm-roles'));
  const pin=document.getElementById('sm-pin')?.value?.trim();
  const email=document.getElementById('sm-email')?.value?.trim();
  if(!name||!pin){alert('Name and PIN are required.');return;}
  if(!roles.length){alert('Please select at least one role.');return;}
  if(pin.length!==4||!/^\d+$/.test(pin)){alert('PIN must be exactly 4 digits.');return;}
  const res=await fetch('/api/staff',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({admin_pin:_currentPin,name,role:roles.join(','),pin,email})});
  const data=await res.json();
  if(data.error){alert(data.error);return;}
  document.getElementById('modal-staff')?.remove();
  loadStaffList();
}

function showEditStaffModal(id, name, roleStr, email, active) {
  const currentRoles = (roleStr||'').split(',').map(r=>r.trim()).filter(Boolean);
  const modal = document.createElement('div');
  modal.className='modal-overlay'; modal.id='modal-staff-edit';
  modal.innerHTML=`<div class="modal-box" style="max-width:400px">
    <h3>Edit: ${name}</h3>
    <label>Name</label>
    <input type="text" id="se-name" value="${name}">
    <label style="margin-top:0.75rem">New PIN (leave blank to keep current)</label>
    <input type="text" id="se-pin" maxlength="4" placeholder="4 digits">
    <label style="margin-top:0.75rem">Email</label>
    <input type="email" id="se-email" value="${email}">
    <label style="margin-top:0.75rem">Roles (select all that apply)</label>
    <div id="se-roles">${roleCheckboxes(currentRoles)}</div>
    <label style="margin-top:0.75rem">Status</label>
    <select id="se-active">
      <option value="1" ${active?'selected':''}>Active</option>
      <option value="0" ${!active?'selected':''}>Inactive</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-staff-edit').remove()">Cancel</button>
      <button class="btn btn-danger" onclick="deleteStaffMember(${id},'${name.replace(/'/g,"\\'")}')">Delete</button>
      <button class="btn btn-primary" onclick="submitEditStaff(${id})">Save Changes</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function deleteStaffMember(id, name) {
  if (!confirm(`Permanently delete ${name}? This cannot be undone. (If you just want to disable their login, use Status: Inactive instead.)`)) return;
  const res = await fetch(`/api/staff/${id}`, { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({admin_pin:_currentPin}) });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('modal-staff-edit')?.remove();
  loadStaffList();
}

async function submitEditStaff(id) {
  const name=document.getElementById('se-name')?.value?.trim();
  const pin=document.getElementById('se-pin')?.value?.trim();
  const email=document.getElementById('se-email')?.value?.trim();
  const roles=getCheckedRoles(document.getElementById('se-roles'));
  const active=parseInt(document.getElementById('se-active')?.value);
  if(!name){alert('Name is required.');return;}
  if(!roles.length){alert('Please select at least one role.');return;}
  if(pin&&(pin.length!==4||!/^\d+$/.test(pin))){alert('PIN must be 4 digits.');return;}
  const body={admin_pin:_currentPin,name,email,role:roles.join(','),active};
  if(pin) body.pin=pin;
  const res=await fetch(`/api/staff/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(data.error){alert(data.error);return;}
  document.getElementById('modal-staff-edit')?.remove();
  loadStaffList();
}

async function seedStaffMembers() {
  if(!confirm('This will reset ALL staff PINs to the master list. Continue?'))return;
  const btn=event.target; btn.textContent='Resetting...'; btn.disabled=true;
  const res=await fetch('/api/seed-staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:_currentPin})});
  const data=await res.json();
  if(data.error){alert(data.error);btn.textContent='🔄 Reset to Master List';btn.disabled=false;return;}
  document.getElementById('seed-staff-msg').textContent=`✓ ${data.inserted} staff members loaded.`;
  btn.textContent='🔄 Reset to Master List';btn.disabled=false;
  loadStaffList();
}

async function syncKnownEmails() {
  const btn=event.target; const orig=btn.textContent; btn.textContent='Syncing...'; btn.disabled=true;
  try {
    const res=await fetch('/api/staff/sync-known-emails',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_pin:_currentPin})});
    const data=await res.json();
    if(data.error){alert(data.error);btn.textContent=orig;btn.disabled=false;return;}
    const msg = data.updated.length ? `✓ Added emails for: ${data.updated.join(', ')}` : 'No changes — everyone already has an email on file.';
    document.getElementById('sync-emails-msg').textContent=msg;
    btn.textContent=orig;btn.disabled=false;
    loadStaffList();
  } catch(e) { alert('Connection error — please try again.'); btn.textContent=orig; btn.disabled=false; }
}
</script>

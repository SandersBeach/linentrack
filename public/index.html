<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SandersCentral</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SandersCentral">
<meta name="theme-color" content="#1D9E75">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/sbr-icon-192.png">
<style>
  :root {
    --teal: #1D9E75; --teal-light: #E1F5EE; --teal-dark: #0F6E56; --teal-mid: #5DCAA5;
    --blue: #185FA5; --blue-light: #E6F1FB; --blue-mid: #378ADD;
    --coral: #D85A30; --coral-light: #FAECE7; --coral-dark: #993C1D;
    --amber: #854F0B; --amber-light: #FAEEDA;
    --green: #3B6D11; --green-light: #EAF3DE;
    --gray-50: #F7F7F5; --gray-100: #EFEFEC; --gray-200: #D8D8D3;
    --gray-400: #9A9A94; --gray-700: #444441; --gray-900: #1A1A18;
    --radius: 10px; --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }

  /* ── Login ── */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background: var(--gray-50); }
  .login-card { background: #fff; border: 0.5px solid var(--gray-200); border-radius: var(--radius); padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center; }
  .login-logo { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .login-logo span { color: var(--teal); }
  .login-sub { font-size: 13px; color: var(--gray-400); margin-bottom: 1rem; }
  .pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gray-200); transition: all 0.15s; }
  .pin-dot.filled { background: var(--teal); border-color: var(--teal); }
  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .num-btn { padding: 14px; border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); background: #fff; font-size: 18px; font-weight: 500; cursor: pointer; transition: all 0.1s; }
  .num-btn:hover { background: var(--gray-50); }
  .num-btn:active { background: var(--gray-100); transform: scale(0.97); }
  .num-btn.del { font-size: 14px; color: var(--gray-400); }
  .login-err { color: var(--coral); font-size: 13px; margin-top: 1rem; min-height: 20px; }

  /* ── App shell ── */
  #app { display: none; }
  .topbar { background: #fff; border-bottom: 0.5px solid var(--gray-200); padding: 0 1.25rem; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 100; }
  .topbar-logo { font-size: 16px; font-weight: 600; }
  .topbar-logo span { color: var(--teal); }
  .topbar-role { font-size: 12px; color: var(--gray-400); display: flex; align-items: center; gap: 8px; }
  .topbar-role button { font-size: 12px; color: var(--coral); background: none; border: none; cursor: pointer; padding: 4px 8px; }
  .tab-bar { background: #fff; border-bottom: 0.5px solid var(--gray-200); display: flex; padding: 0 1rem; overflow-x: auto; gap: 0; }
  .tab-btn { padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--gray-400); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; }
  .tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }
  .content { padding: 1.25rem; max-width: 760px; margin: 0 auto; }

  /* ── Components ── */
  .card { background: #fff; border: 0.5px solid var(--gray-200); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-400); margin-bottom: 1rem; }
  .scan-zone { border: 2px dashed var(--gray-200); border-radius: var(--radius); padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.15s; margin-bottom: 1rem; }
  .scan-zone:hover { border-color: var(--teal-mid); background: var(--teal-light); }
  .scan-zone svg { width: 36px; height: 36px; stroke: var(--teal); margin-bottom: 8px; }
  .scan-zone p { font-size: 13px; color: var(--gray-400); }
  .scan-zone .hint { font-size: 11px; color: var(--teal); margin-top: 4px; }
  label { font-size: 12px; color: var(--gray-400); display: block; margin-bottom: 4px; }
  input, select { width: 100%; padding: 9px 12px; border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); background: #fff; color: var(--gray-900); margin-bottom: 10px; outline: none; transition: border 0.15s; }
  input:focus, select:focus { border-color: var(--teal); }
  .btn { padding: 10px 20px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-full { width: 100%; justify-content: center; }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-blue { background: var(--blue-light); color: var(--blue); }
  .btn-blue:hover { background: #B5D4F4; }
  .btn-danger { background: var(--coral-light); color: var(--coral-dark); }
  .btn-danger:hover { background: #F5C4B3; }
  .btn-ghost { background: var(--gray-100); color: var(--gray-700); }
  .btn-ghost:hover { background: var(--gray-200); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
  .stat { background: var(--gray-50); border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 0.875rem 1rem; }
  .stat-num { font-size: 26px; font-weight: 600; line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-out { background: var(--coral-light); color: var(--coral-dark); }
  .badge-in { background: var(--teal-light); color: var(--teal-dark); }
  .badge-count { background: var(--blue-light); color: var(--blue); }
  .badge-warn { background: var(--amber-light); color: var(--amber); }
  .badge-ok { background: var(--green-light); color: var(--green); }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--gray-100); }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 13px; font-weight: 500; }
  .row-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .result-box { border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .result-success { background: var(--teal-light); border: 0.5px solid var(--teal-mid); }
  .result-return { background: var(--blue-light); border: 0.5px solid var(--blue-mid); }
  .result-error { background: var(--coral-light); border: 0.5px solid var(--coral); }
  .result-box .r-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .result-box .r-sub { font-size: 12px; color: var(--gray-700); }
  .search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .search-row input, .search-row select { margin-bottom: 0; }
  .empty { text-align: center; padding: 2.5rem; color: var(--gray-400); font-size: 13px; }
  .divider { height: 0.5px; background: var(--gray-100); margin: 12px 0; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .section-header h2 { font-size: 15px; font-weight: 600; }
  .tag { display: inline-block; padding: 2px 8px; background: var(--gray-100); border-radius: 20px; font-size: 11px; color: var(--gray-700); font-family: monospace; }
  .cleaner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 1rem; }
  .cleaner-card { background: #fff; border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 0.875rem 1rem; display: flex; align-items: center; justify-content: space-between; }
  .cleaner-card .c-name { font-size: 13px; font-weight: 500; }
  .cleaner-card .c-count { font-size: 11px; color: var(--gray-400); }

  /* ── Supply cards grid ── */
  .supply-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 1rem; }
  .supply-card { background: #fff; border: 0.5px solid var(--gray-200); border-radius: var(--radius); padding: 1rem; }
  .supply-card.low-stock { border-color: var(--coral); border-width: 1.5px; }
  .supply-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .supply-name { font-size: 14px; font-weight: 600; }
  .supply-cat { font-size: 11px; color: var(--gray-400); margin-bottom: 10px; }
  .supply-qty { font-size: 28px; font-weight: 700; line-height: 1; }
  .supply-unit { font-size: 11px; color: var(--gray-400); }
  .supply-threshold { font-size: 11px; color: var(--gray-400); margin-top: 2px; margin-bottom: 10px; }
  .supply-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .supply-actions .btn { font-size: 12px; padding: 6px 12px; }

  /* ── Sub-tabs ── */
  .subtab-bar { display: flex; gap: 0; border-bottom: 0.5px solid var(--gray-200); margin-bottom: 1rem; }
  .subtab { padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--gray-400); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .subtab.active { color: var(--teal); border-bottom-color: var(--teal); }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 1rem; }
  .modal-box { background: #fff; border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; color: var(--teal-dark); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }

  /* ── Inventory count ── */
  .count-area-card { border: 1.5px solid var(--gray-200); border-radius: var(--radius); padding: 1rem; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 12px; }
  .count-area-card.selected { border-color: var(--teal); background: var(--teal-light); }
  .count-area-card input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--teal); flex-shrink: 0; }
  .count-progress { height: 6px; background: var(--gray-200); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .count-progress-bar { height: 100%; background: var(--teal); border-radius: 4px; transition: width 0.3s; }
  .count-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid var(--gray-100); gap: 10px; }
  .count-row:last-child { border-bottom: none; }
  .count-row-left { flex: 1; min-width: 0; }
  .count-row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .count-input { width: 70px; padding: 6px 8px; border: 0.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 0; }
  .count-input:focus { border-color: var(--teal); }
  .variance-pos { color: var(--amber); font-weight: 600; font-size: 12px; }
  .variance-neg { color: var(--coral-dark); font-weight: 600; font-size: 12px; }
  .variance-ok { color: var(--green); font-weight: 600; font-size: 12px; }
  .report-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1rem; }
  .report-stat { border-radius: var(--radius-sm); padding: 0.75rem 1rem; text-align: center; }
  .report-stat .rnum { font-size: 22px; font-weight: 700; line-height: 1; }
  .report-stat .rlbl { font-size: 11px; margin-top: 4px; }

  /* ── PO Request ── */
  .po-urgency-routine { background: var(--gray-100); color: var(--gray-700); }
  .po-urgency-atrisk { background: var(--amber-light); color: var(--amber); }
  .po-urgency-unstayable { background: var(--coral-light); color: var(--coral-dark); }

  /* ── Scan result animated entry ── */
  @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .anim { animation: slideIn 0.2s ease; }
</style>
</head>
<body>

<!-- ══════════════ PO REQUEST PRE-LOGIN ══════════════ -->
<div id="po-prelogin" style="display:none">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--gray-50)">
    <div style="background:#fff;border:0.5px solid var(--gray-200);border-radius:var(--radius);padding:2rem;width:100%;max-width:480px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.5rem">
        <button onclick="hidePOPreLogin()" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--gray-400);line-height:1">←</button>
        <div>
          <div style="font-size:16px;font-weight:600">📝 POCentral</div>
          <div style="font-size:12px;color:var(--gray-400)">SandersCentral</div>
        </div>
      </div>
      <div class="form-row">
        <div><label>Your name</label><input type="text" id="po-pl-name" placeholder="Full name"></div>
        <div><label>Your email</label><input type="email" id="po-pl-email" placeholder="you@sandersbeachrentals.com"></div>
      </div>
      <div class="form-row">
        <div><label>Vendor</label><input type="text" id="po-pl-vendor" placeholder="e.g. Amazon, Home Depot"></div>
        <div><label>Amount ($)</label><input type="number" id="po-pl-amount" placeholder="0.00" min="0" step="0.01"></div>
      </div>
      <label>Category</label>
      <select id="po-pl-category">
        <option value="">Select a category...</option>
        <option>Advertising (Google & FB only)</option>
        <option>AI Office Expense & Misc</option>
        <option>AL Repairs</option>
        <option>Auto Servicing & Repairs (including car wash)</option>
        <option>Bayhouse SBR Expense</option>
        <option>Billable Upgrade - A/C Filters</option>
        <option>Billable Upgrade - Landscaping</option>
        <option>Billable Upgrade - Small appliances & Home Goods</option>
        <option>Billable upgrade to home - Large Appliances</option>
        <option>Billable Upgrades - Linen Purchases</option>
        <option>Business Merchandise and Development - COGS</option>
        <option>Client/Owner Meals/Gifts</option>
        <option>Computer/Software Subscriptions</option>
        <option>Employee Promotions/Rewards/Gifts/Incentives - Alabama</option>
        <option>Employee Promotions/Rewards/Gifts/Incentives - Florida</option>
        <option>FL Cleaning Supplies - Housekeeping</option>
        <option>FL Maintenance Equipment</option>
        <option>FL Maintenance Supplies</option>
        <option>FL Office Expenses & Misc</option>
        <option>FL Repairs/Service Calls</option>
        <option>Fuel - Alabama</option>
        <option>Fuel - Florida - Housekeeping</option>
        <option>Fuel - Florida - Maintenance</option>
        <option>Guest Damage</option>
        <option>Guest Fees</option>
        <option>Human Resources</option>
        <option>Marketing</option>
        <option>Meals - Dothan Office</option>
        <option>Meals - Housekeeping Team</option>
        <option>Meals - Maintenance Team</option>
        <option>Medical Insurance</option>
        <option>Mileage</option>
        <option>MISC</option>
        <option>New Hire Expense</option>
        <option>Professional Growth/Education</option>
        <option>Reservation Expense - COGS</option>
        <option>Travel</option>
        <option>VRBO Renewals</option>
      </select>
      <label>Urgency</label>
      <select id="po-pl-urgency">
        <option value="Routine">📋 Routine</option>
        <option value="At Risk">⚠️ At Risk</option>
        <option value="Unstayable">🚨 Unstayable</option>
      </select>
      <label>Date needed by</label>
      <input type="date" id="po-pl-date">
      <label>Description / reason for purchase</label>
      <input type="text" id="po-pl-description" placeholder="What are you buying and why?">
      <button class="btn btn-primary btn-full" id="po-pl-submit-btn" onclick="submitPOPreLogin()" style="margin-top:4px">Submit Request</button>
      <div id="po-pl-err" style="font-size:13px;color:var(--coral);margin-top:8px;min-height:18px;text-align:center"></div>
    </div>
  </div>
</div>

<!-- ══════════════ LOGIN ══════════════ -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="login-logo"><span>Sanders</span>Central</div>
    <div class="login-sub">Warehouse · Admin · Maintenance · Coordinator</div>
    <div style="margin-bottom:1.25rem">
      <button class="btn" style="width:100%;background:var(--teal-light);color:var(--teal-dark);border:0.5px solid var(--teal-mid);font-size:13px;font-weight:600;padding:10px;justify-content:center" onclick="showPOPreLogin()">📝 Submit a Purchase Request</button>
    </div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="numpad">
      <button class="num-btn" onclick="pinPress('1')">1</button>
      <button class="num-btn" onclick="pinPress('2')">2</button>
      <button class="num-btn" onclick="pinPress('3')">3</button>
      <button class="num-btn" onclick="pinPress('4')">4</button>
      <button class="num-btn" onclick="pinPress('5')">5</button>
      <button class="num-btn" onclick="pinPress('6')">6</button>
      <button class="num-btn" onclick="pinPress('7')">7</button>
      <button class="num-btn" onclick="pinPress('8')">8</button>
      <button class="num-btn" onclick="pinPress('9')">9</button>
      <button class="num-btn del" onclick="pinClear()">Clear</button>
      <button class="num-btn" onclick="pinPress('0')">0</button>
      <button class="num-btn del" onclick="pinDel()">⌫</button>
    </div>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo" id="topbar-logo"><span>Sanders</span>Central</div>
    <div class="topbar-role">
      <span id="role-label"></span>
      <button onclick="logout()">Sign out</button>
    </div>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
  <div class="content" id="main-content"></div>
</div>

<!-- ══════════════ SUPPLY MODALS ══════════════ -->
<div id="modal-supply-item" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeSupplyItemModal()">
  <div class="modal-box">
    <h3 id="supply-modal-title">Add Supply Item</h3>
    <input type="hidden" id="supply-edit-id">
    <label>Item name</label>
    <input id="supply-name" type="text" placeholder="e.g. AA Batteries">
    <label>Category</label>
    <input id="supply-category" type="text" placeholder="e.g. Electrical" list="supply-cat-list">
    <datalist id="supply-cat-list"></datalist>
    <label>Unit (what you count in)</label>
    <input id="supply-unit" type="text" placeholder="e.g. packs, bulbs, rolls">
    <label>Low-stock alert below</label>
    <input id="supply-threshold" type="number" min="0" value="5">
    <div id="supply-qty-row">
      <label>Starting quantity</label>
      <input id="supply-init-qty" type="number" min="0" value="0">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSupplyItemModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSupplyItem()">Save</button>
    </div>
  </div>
</div>

<div id="modal-supply-tx" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeSupplyTxModal()">
  <div class="modal-box">
    <h3 id="tx-modal-title">Take Supplies</h3>
    <input type="hidden" id="tx-supply-id">
    <input type="hidden" id="tx-action">
    <p id="tx-item-info" style="font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:1rem;padding:10px;background:var(--gray-50);border-radius:var(--radius-sm)"></p>
    <label>Quantity</label>
    <input id="tx-qty" type="number" min="1" value="1">
    <label>Your name</label>
    <select id="tx-performer">
      <option value="">Select your name...</option>
    </select>
    <label>Notes (optional)</label>
    <input id="tx-notes" type="text" placeholder="e.g. used at HOME-12">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSupplyTxModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitSupplyTx()">Confirm</button>
    </div>
  </div>
</div>

<div id="modal-supply-qr" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-box" style="text-align:center">
    <h3 id="qr-item-name" style="text-align:center"></h3>
    <img id="qr-img" src="" style="width:200px;height:200px;border:0.5px solid var(--gray-200);border-radius:var(--radius);margin:12px auto;display:block">
    <p style="font-size:12px;color:var(--gray-400);margin-bottom:1rem">Scan to take or restock</p>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-supply-qr').style.display='none'">Close</button>
      <button class="btn btn-primary" onclick="printSupplyQR()">🖨 Print</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let role = null;
let pinVal = '';
let _currentPin = '';
let _currentStaffName = '';
let _currentStaffId = null;
let _supplies = [];
let _hkSupplies = [];
let _ordersModuleFilter = 'housekeeping';
let _ordersViewMode = 'pending';
let _placeOrderItems = [];
let _loanerStaff = [];

const TABS = {
  warehouse: ['scan', 'overdue', 'status', 'homes', 'log', 'hk_supply', 'orders', 'forecast', 'po_request'],
  maintenance: ['loaner_scan', 'loaner_status', 'loaner_log', 'supply_scan', 'supply_status', 'orders', 'store', 'po_request'],
  inspector: ['store', 'po_request'],
  coordinator: ['inventory_count', 'po_request'],
  admin: ['scan', 'overdue', 'status', 'homes', 'log', 'loaner_scan', 'loaner_status', 'loaner_log', 'supply_scan', 'supply_status', 'hk_supply', 'orders', 'forecast', 'store', 'inventory_count', 'po_request', 'cleaners', 'settings']
};
const TAB_LABELS = {
  scan: 'Scan Bag', overdue: '🚨 Overdue', status: 'Who Has What', homes: 'By Home',
  log: 'Activity Log', cleaners: 'Cleaners', settings: 'Settings',
  loaner_scan: '📦 Scan Loaner', loaner_status: 'Loaners Out', loaner_log: 'Loaner Log',
  supply_scan: '🧰 SupplyCentral', supply_status: 'Supply Inventory',
  inventory_count: '📋 InventoryCentral',
  po_request: '📝 POCentral',
  hk_supply: '🧴 Housekeeping Supplies',
  orders: '📦 Orders',
  forecast: '🔮 Forecast',
  store: '🏪 Store'
};
let currentTab = 'scan';

// ── PIN ────────────────────────────────────────────────────────────────────────
function pinPress(d) {
  if (pinVal.length >= 4) return;
  pinVal += d;
  updateDots();
  if (pinVal.length === 4) setTimeout(submitPin, 80);
}
function pinDel() { pinVal = pinVal.slice(0, -1); updateDots(); }
function pinClear() { pinVal = ''; updateDots(); }
function updateDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pinVal.length);
  }
}
async function submitPin() {
  document.getElementById('login-err').textContent = '';
  try {
    const r = await fetch('/api/staff/auth', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ pin: pinVal }) });
    const data = await r.json();
    if (!r.ok || !data.success) { document.getElementById('login-err').textContent = 'Wrong PIN — try again'; pinVal = ''; updateDots(); return; }
    role = data.role;
    _currentPin = pinVal;
    _currentStaffName = data.name || '';
    _currentStaffId = data.id || null;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('role-label').textContent =
      role === 'admin' ? '🔑 Admin' :
      role === 'maintenance' ? '🔧 Maintenance' :
      role === 'coordinator' ? '📋 Coordinator' :
      role === 'inspector' ? '🔍 Inspector' : '📦 Warehouse';
    buildTabs();
    fetch('/api/maintenance_staff').then(r=>r.json()).then(d => { _loanerStaff = d; });
    const defaultView = sessionStorage.getItem('defaultView');
    if (defaultView === 'loaners' && (role === 'maintenance' || role === 'admin')) {
      sessionStorage.removeItem('defaultView');
      showTab('loaner_scan');
    } else if (role === 'coordinator') {
      showTab('inventory_count');
    } else if (role === 'maintenance') {
      showTab('loaner_scan');
    } else {
      showTab('scan');
    }
    checkPendingQrScan();
    checkPendingSupplyScan();
  } catch (e) { document.getElementById('login-err').textContent = 'Connection error'; pinVal = ''; updateDots(); }
}
function logout() { role = null; pinVal = ''; _currentPin = ''; _currentStaffName = ''; _currentStaffId = null; updateDots(); document.getElementById('login').style.display = 'flex'; document.getElementById('app').style.display = 'none'; }

// ── Tabs ───────────────────────────────────────────────────────────────────────
function buildTabs() {
  const tabs = TABS[role] || [];
  document.getElementById('tab-bar').innerHTML = tabs.map(t =>
    `<button class="tab-btn" onclick="showTab('${t}')" id="tab-${t}">${TAB_LABELS[t]}</button>`
  ).join('');
}
const MODULE_NAMES = {
  scan: 'LinenCentral',
  overdue: 'LinenCentral',
  status: 'LinenCentral',
  homes: 'LinenCentral',
  log: 'LinenCentral',
  cleaners: 'LinenCentral',
  settings: 'SandersCentral',
  loaner_scan: 'LoanerCentral',
  loaner_status: 'LoanerCentral',
  loaner_log: 'LoanerCentral',
  supply_scan: 'SupplyCentral',
  supply_status: 'SupplyCentral',
  inventory_count: 'InventoryCentral',
  po_request: 'POCentral',
  hk_supply: 'HousekeepingSupplyCentral',
  orders: 'OrdersCentral',
  forecast: 'ForecastCentral',
  store: 'StoreCentral'
};
function showTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tab-' + t);
  if (el) el.classList.add('active');
  // Update topbar module name
  const moduleName = MODULE_NAMES[t] || 'SandersCentral';
  const logoEl = document.getElementById('topbar-logo');
  if (logoEl) logoEl.innerHTML = '<span>Sanders</span>Central <span style="font-weight:400;color:var(--gray-400);font-size:13px">· ' + moduleName + '</span>';
  const fns = {
    scan: renderScan, overdue: renderOverdue, status: renderStatus, homes: renderHomes,
    log: renderLog, cleaners: renderCleaners, settings: renderSettings,
    loaner_scan: renderLoanerScan, loaner_status: renderLoanerStatus, loaner_log: renderLoanerLog,
    supply_scan: renderSupplyScan, supply_status: renderSupplyStatus,
    inventory_count: renderInventoryCount,
    po_request: renderPORequest,
    hk_supply: renderHKSupply,
    orders: renderOrders,
    forecast: renderForecast,
    store: renderStore
  };
  if (fns[t]) fns[t]();
}

// ── Scan Tab ───────────────────────────────────────────────────────────────────
let scanState = { bag: null, cleaners: [], selectedCleaner: null, sessionLog: [], mode: 'out' };

async function renderScan() {
  const cr = await fetch('/api/cleaners');
  scanState.cleaners = await cr.json();
  const opts = scanState.cleaners.map(c => `<option value="${c.id}" ${scanState.selectedCleaner==c.id?'selected':''}>${c.name}</option>`).join('');
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="card-title">Session mode</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn ${scanState.mode==='out'?'btn-primary':'btn-ghost'}" style="flex:1" onclick="setMode('out')">Stage bags for pickup</button>
        <button class="btn ${scanState.mode==='in'?'btn-blue':'btn-ghost'}" style="flex:1" onclick="setMode('in')">Checking bags back in</button>
      </div>
      <div id="cleaner-row" style="${scanState.mode==='out'?'':'display:none'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <label style="margin-bottom:0">Cleaner for this batch</label>
          ${scanState.selectedCleaner ? `<button class="btn btn-ghost btn-sm" onclick="clearCleaner()" style="font-size:11px;padding:3px 10px">Change cleaner</button>` : ''}
        </div>
        <select id="cleaner-sel" onchange="onCleanerChange(this.value)" style="margin-bottom:12px">
          <option value="">Select cleaner...</option>${opts}
        </select>
        ${scanState.selectedCleaner ? `<div style="font-size:11px;color:var(--teal-dark);margin-top:-8px;margin-bottom:8px">✓ Scanning for: <strong>${scanState.cleaners.find(c=>c.id==scanState.selectedCleaner)?.name||''}</strong></div>` : ''}
      </div>
      <label>Scan bag tag</label>
      <input type="text" id="scan-input" placeholder="Scan or type bag ID..." autocomplete="off" autocapitalize="off"
        onkeydown="if(event.key==='Enter')processScan()" />
      <div style="font-size:12px;color:var(--gray-400);margin-top:-6px;margin-bottom:10px">Scanner auto-submits · or press Enter after typing</div>
    </div>
    <div id="session-log"></div>
  `;
  focusScanInput();
  renderSessionLog();
}
function setMode(m) { scanState.mode = m; scanState.sessionLog = []; renderScan(); }
function onCleanerChange(val) {
  scanState.selectedCleaner = val;
  const cr = document.getElementById('cleaner-row');
  if (!cr || !val) return;
  const name = scanState.cleaners.find(c=>c.id==val)?.name||'';
  let conf = cr.querySelector('.cleaner-confirm');
  if (!conf) { conf = document.createElement('div'); conf.className = 'cleaner-confirm'; conf.style.cssText = 'font-size:11px;color:var(--teal-dark);margin-top:-8px;margin-bottom:8px'; cr.appendChild(conf); }
  conf.innerHTML = `✓ Scanning for: <strong>${name}</strong>`;
  focusScanInput();
}
function clearCleaner() { scanState.selectedCleaner = null; scanState.sessionLog = []; renderScan(); }
function focusScanInput() { setTimeout(() => document.getElementById('scan-input')?.focus(), 50); }
function renderSessionLog() {
  const log = scanState.sessionLog;
  if (!log.length) return;
  const errors = log.filter(l=>l.error).length;
  let html = `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div class="card-title" style="margin-bottom:0">This session</div><div style="display:flex;gap:6px"><span class="badge badge-count">${log.length} scanned</span>${errors?`<span class="badge badge-out">${errors} errors</span>`:''}</div></div>`;
  [...log].reverse().forEach(l => {
    html += `<div class="row"><div class="row-main"><div class="row-title"><span class="tag">${l.id}</span> · ${l.home}</div><div class="row-sub" style="color:${l.error?'var(--coral)':'var(--gray-400)'}">${l.msg}</div></div><span class="badge ${l.error?'badge-out':l.action==='out'?'badge-out':'badge-in'}">${l.error?'Error':l.action==='out'?'Out':'In'}</span></div>`;
  });
  html += '</div>';
  const el = document.getElementById('session-log');
  if (el) el.innerHTML = html;
}
async function processScan() {
  const input = document.getElementById('scan-input');
  let raw = (input?.value || '').trim();
  let id = raw;
  if (raw.includes('?') || raw.includes('=')) {
    const bagMatch = raw.match(/[?&][Bb][Aa][Gg]=([A-Za-z0-9-]+)/);
    const loanerMatch = raw.match(/[?&][Ll][Oo][Aa][Nn][Ee][Rr]=([A-Za-z0-9-]+)/);
    if (bagMatch) id = bagMatch[1].toUpperCase();
    else if (loanerMatch) id = loanerMatch[1].toUpperCase();
    else id = raw.toUpperCase();
  } else { id = raw.toUpperCase(); }
  if (!id) return;
  input.value = '';
  if (scanState.mode === 'out') {
    const cleaner_id = document.getElementById('cleaner-sel')?.value || scanState.selectedCleaner;
    if (!cleaner_id) { scanState.sessionLog.push({id, home:'—', msg:'Select a cleaner first', error:true, action:'out'}); renderSessionLog(); focusScanInput(); return; }
    scanState.selectedCleaner = cleaner_id;
    try {
      const r = await fetch(`/api/bag/${encodeURIComponent(id)}/checkout`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cleaner_id: parseInt(cleaner_id)}) });
      const data = await r.json();
      if (r.ok) { const cname = scanState.cleaners.find(c=>c.id==cleaner_id)?.name||''; scanState.sessionLog.push({id, home:data.home, msg:`Staged for ${cname} — awaiting pickup`, error:false, action:'out'}); }
      else { const br = await fetch('/api/bag/'+encodeURIComponent(id)); const bag = await br.json(); scanState.sessionLog.push({id, home:bag.home_name||'—', msg:data.error, error:true, action:'out'}); }
    } catch(e) { scanState.sessionLog.push({id, home:'—', msg:'Connection error', error:true, action:'out'}); }
  } else {
    try {
      const r = await fetch(`/api/bag/${encodeURIComponent(id)}/checkin`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({notes:''}) });
      const data = await r.json();
      if (r.ok) { scanState.sessionLog.push({id, home:data.home, msg:`Returned by ${data.cleaner}`, error:false, action:'in'}); }
      else { const br = await fetch('/api/bag/'+encodeURIComponent(id)); const bag = await br.json(); scanState.sessionLog.push({id, home:bag.home_name||'—', msg:data.error, error:true, action:'in'}); }
    } catch(e) { scanState.sessionLog.push({id, home:'—', msg:'Connection error', error:true, action:'in'}); }
  }
  renderSessionLog(); focusScanInput();
}
async function lookupBag() { await processScan(); }

// ── Overdue Tab ────────────────────────────────────────────────────────────────
async function renderOverdue() {
  document.getElementById('main-content').innerHTML = '<div class="card">Checking for overdue bags...</div>';
  const inv = await fetch('/api/inventory').then(r => r.json());
  const now = new Date();
  const overdue = inv.filter(b => { if (b.status !== 'out' || !b.picked_up_at) return false; return (now - new Date(b.picked_up_at)) / 3600000 >= 24; });
  if (!overdue.length) { document.getElementById('main-content').innerHTML = `<div class="card" style="text-align:center;padding:2.5rem"><div style="font-size:32px;margin-bottom:8px">✓</div><div style="font-size:15px;font-weight:500;color:var(--teal)">All bags returned on time</div><div style="font-size:13px;color:var(--gray-400);margin-top:4px">Nothing overdue right now</div></div>`; return; }
  const byCleaner = {};
  overdue.forEach(b => { if (!byCleaner[b.cleaner_name]) byCleaner[b.cleaner_name]=[]; byCleaner[b.cleaner_name].push(b); });
  let html = `<div style="background:var(--coral-light);border:0.5px solid var(--coral);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;gap:12px"><div style="font-size:28px">🚨</div><div><div style="font-size:15px;font-weight:500;color:var(--coral-dark)">${overdue.length} bag${overdue.length!==1?'s':''} overdue</div><div style="font-size:12px;color:var(--coral-dark)">Out for more than 24 hours</div></div></div>`;
  Object.entries(byCleaner).sort().forEach(([name, bags]) => {
    html += `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-size:14px;font-weight:600;color:var(--coral-dark)">⚠ ${name}</div><span class="badge badge-out">${bags.length} overdue</span></div>`;
    bags.forEach(b => { const out=new Date(b.picked_up_at); const hours=Math.floor((now-out)/3600000); const days=Math.floor(hours/24); const timeStr=days>0?`${days}d ${hours%24}hr`:`${hours}hr`; const since=out.toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); html+=`<div class="row"><div class="row-main"><div class="row-title">${b.home_name} <span class="tag">${b.id}</span></div><div class="row-sub">Picked up ${since} · <strong style="color:var(--coral-dark)">${timeStr} ago</strong></div></div><span class="badge badge-out">Overdue</span></div>`; });
    html += `</div>`;
  });
  document.getElementById('main-content').innerHTML = html;
}

// ── Status Tab ─────────────────────────────────────────────────────────────────
async function renderStatus() {
  document.getElementById('main-content').innerHTML = '<div class="card">Loading...</div>';
  const [inv, stats] = await Promise.all([fetch('/api/inventory').then(r=>r.json()), fetch('/api/stats').then(r=>r.json())]);
  const byCleaner = {}; const inWarehouse = [];
  const byCleanerStaged = {};
  inv.forEach(b => {
    if (b.status==='out') { if (!byCleaner[b.cleaner_name]) byCleaner[b.cleaner_name]=[]; byCleaner[b.cleaner_name].push(b); }
    else if (b.status==='staged') { if (!byCleanerStaged[b.cleaner_name]) byCleanerStaged[b.cleaner_name]=[]; byCleanerStaged[b.cleaner_name].push(b); }
    else inWarehouse.push(b);
  });
  let html = `<div class="stat-grid" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><div class="stat-num">${stats.total}</div><div class="stat-lbl">Total bags</div></div><div class="stat"><div class="stat-num" style="color:var(--amber)">${stats.staged||0}</div><div class="stat-lbl">Staged</div></div><div class="stat"><div class="stat-num" style="color:var(--coral)">${stats.out}</div><div class="stat-lbl">With cleaners</div></div><div class="stat"><div class="stat-num" style="color:var(--teal)">${stats['in']}</div><div class="stat-lbl">At warehouse</div></div></div>
    <div class="search-row"><input type="text" id="status-q" placeholder="Search bag, home, or cleaner..." oninput="filterStatus()" /><select id="status-f" onchange="filterStatus()" style="width:150px"><option value="">All</option><option value="out">With cleaners</option><option value="in">At warehouse</option></select></div><div id="status-body">`;
  // Staged bags section
  Object.entries(byCleanerStaged).sort().forEach(([name, bags]) => {
    html += `<div class="card" data-section="staged"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-size:14px;font-weight:600">${name}</div><span class="badge badge-warn">${bags.length} staged</span></div>`;
    bags.forEach(b => { const since=b.staged_at?new Date(b.staged_at).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''; html+=`<div class="row" data-search="${b.id.toLowerCase()} ${b.home_name.toLowerCase()} ${name.toLowerCase()}"><div class="row-main"><div class="row-title">${b.home_name} <span class="tag">${b.id}</span></div><div class="row-sub">⏳ Staged ${since} — awaiting pickup</div></div><span class="badge badge-warn">Staged</span></div>`; });
    html += `</div>`;
  });
  // Out bags section
  Object.entries(byCleaner).sort().forEach(([name, bags]) => {
    html += `<div class="card" data-section="out"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-size:14px;font-weight:600">${name}</div><span class="badge badge-count">${bags.length} bag${bags.length!==1?'s':''}</span></div>`;
    bags.forEach(b => { const since=b.picked_up_at?new Date(b.picked_up_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''; html+=`<div class="row" data-search="${b.id.toLowerCase()} ${b.home_name.toLowerCase()} ${name.toLowerCase()}"><div class="row-main"><div class="row-title">${b.home_name} <span class="tag">${b.id}</span></div>${since?`<div class="row-sub">Picked up ${since}</div>`:''}</div><span class="badge badge-out">Out</span></div>`; });
    html += `</div>`;
  });
  if (inWarehouse.length) { html+=`<div class="card" data-section="in"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-size:14px;font-weight:600">At warehouse</div><span class="badge badge-in">${inWarehouse.length} bags</span></div>`; inWarehouse.forEach(b=>{html+=`<div class="row" data-search="${b.id.toLowerCase()} ${b.home_name.toLowerCase()}"><div class="row-main"><div class="row-title">${b.home_name} <span class="tag">${b.id}</span></div></div><span class="badge badge-in">In</span></div>`;}); html+=`</div>`; }
  html += `</div>`;
  document.getElementById('main-content').innerHTML = html;
}
function filterStatus() {
  const q=(document.getElementById('status-q')?.value||'').toLowerCase(); const f=document.getElementById('status-f')?.value||'';
  document.querySelectorAll('[data-section]').forEach(sec => { const section=sec.dataset.section; if(f&&section!==f){sec.style.display='none';return;} sec.style.display=''; if(q){let any=false;sec.querySelectorAll('[data-search]').forEach(r=>{const match=r.dataset.search.includes(q);r.style.display=match?'':'none';if(match)any=true;});sec.style.display=any?'':'none';}else{sec.querySelectorAll('[data-search]').forEach(r=>r.style.display='');} });
}

// ── Homes Tab ──────────────────────────────────────────────────────────────────
async function renderHomes() {
  document.getElementById('main-content').innerHTML = '<div class="card">Loading...</div>';
  const inv = await fetch('/api/inventory').then(r => r.json());
  const homeMap = {};
  inv.forEach(b => { if (!homeMap[b.home_name]) homeMap[b.home_name]={code:b.home_code,bags:[]}; homeMap[b.home_name].bags.push(b); });
  let html = `<div class="search-row"><input type="text" id="home-q" placeholder="Search home..." oninput="filterHomes()" /></div><div id="homes-body">`;
  Object.entries(homeMap).sort((a,b)=>a[1].code.localeCompare(b[1].code)).forEach(([name,{code,bags}]) => {
    const out=bags.filter(b=>b.status==='out'); const inW=bags.filter(b=>b.status==='in');
    html+=`<div class="card home-card" data-home="${name.toLowerCase()}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div><div style="font-size:14px;font-weight:600">${name}</div><div style="font-size:11px;color:var(--gray-400)">${code}</div></div><div style="display:flex;gap:6px">${out.length?`<span class="badge badge-out">${out.length} out</span>`:''}${inW.length?`<span class="badge badge-in">${inW.length} in</span>`:''}</div></div>`;
    bags.forEach(b=>{const since=b.checked_out?new Date(b.checked_out).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';html+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px"><span class="tag">${b.id}</span><span style="flex:1;color:var(--gray-400)">${b.status==='out'?'→ '+b.cleaner_name+(since?' ('+since+')':''):'At warehouse'}</span><span class="badge ${b.status==='out'?'badge-out':'badge-in'}" style="font-size:10px">${b.status==='out'?'Out':'In'}</span></div>`;});
    html+=`</div>`;
  });
  html+=`</div>`;
  document.getElementById('main-content').innerHTML = html;
}
function filterHomes() { const q=(document.getElementById('home-q')?.value||'').toLowerCase(); document.querySelectorAll('.home-card').forEach(c=>{c.style.display=!q||c.dataset.home.includes(q)?'':'none';}); }

// ── Log Tab ────────────────────────────────────────────────────────────────────
async function renderLog() {
  document.getElementById('main-content').innerHTML = '<div class="card">Loading...</div>';
  const log = await fetch('/api/activity').then(r => r.json());
  if (!log.length) { document.getElementById('main-content').innerHTML = '<div class="empty">No activity yet</div>'; return; }
  let html = '<div class="card" style="padding:0.75rem 1.25rem">';
  log.forEach(e => { const isReturn=e.action==='Returned'; const dt=new Date(e.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); html+=`<div class="row"><div class="row-main"><div class="row-title"><span class="badge ${isReturn?'badge-in':'badge-out'}" style="margin-right:6px">${e.action}</span><span class="tag">${e.bag_id}</span> · ${e.home_name}</div><div class="row-sub">${dt} · ${e.cleaner_name}${e.notes?' · <em>'+e.notes+'</em>':''}</div></div></div>`; });
  html += '</div>';
  document.getElementById('main-content').innerHTML = html;
}

// ── Cleaners Tab ───────────────────────────────────────────────────────────────
async function renderCleaners() {
  document.getElementById('main-content').innerHTML = '<div class="card">Loading...</div>';
  const cleaners = await fetch('/api/cleaners').then(r => r.json());

let loanerScanState = { staff: [], homes: [], selectedStaff: null, sessionLog: [], mode: 'out' };

async function renderLoanerScan() {
  const [sr, hr] = await Promise.all([fetch('/api/maintenance_staff').then(r=>r.json()), fetch('/api/homes').then(r=>r.json())]);

  document.getElementById('main-content').innerHTML = `

      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn ${loanerScanState.mode==='out'?'btn-primary':'btn-ghost'}" style="flex:1;background:${loanerScanState.mode==='out'?'#E2B04A':''};border-color:${loanerScanState.mode==='out'?'#E2B04A':''}" onclick="setLoanerMode('out')">Deploying to home</button>
        <button class="btn ${loanerScanState.mode==='in'?'btn-blue':'btn-ghost'}" style="flex:1" onclick="setLoanerMode('in')">Retrieving from home</button>
      </div>
      <div id="loaner-staff-row" style="${loanerScanState.mode==='out'?'':'display:none'}">
        <label>Staff member for this trip</label>
        <select id="loaner-staff-sel" onchange="loanerScanState.selectedStaff=this.value" style="margin-bottom:8px"><option value="">Select staff...</option>${staffOpts}</select>
        <label>Delivering to home</label>
        <select id="loaner-home-sel" style="margin-bottom:12px"><option value="">Select home...</option>${homeOpts}</select>
      </div>
      <label>Scan loaner item tag</label>
      <input type="text" id="loaner-scan-input" placeholder="Scan or type item ID..." autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')processLoanerScan()" />
      <div style="font-size:12px;color:var(--gray-400);margin-top:-6px;margin-bottom:10px">Scanner auto-submits · or press Enter after typing</div>
    </div>
    <div id="loaner-session-log"></div>`;
  document.getElementById('loaner-scan-input')?.focus();
}
function setLoanerMode(m) { loanerScanState.mode=m; loanerScanState.sessionLog=[]; renderLoanerScan(); }
async function processLoanerScan() {
  const input=document.getElementById('loaner-scan-input'); let id=(input?.value||'').trim();
  if(id.includes('LOANER=')||id.includes('loaner=')){const match=id.match(/[Ll][Oo][Aa][Nn][Ee][Rr]=([A-Za-z0-9-]+)/);if(match)id=match[1].toUpperCase();}else{id=id.toUpperCase();}
  if(!id)return; input.value='';
  if(loanerScanState.mode==='out'){
    const staff_id=document.getElementById('loaner-staff-sel')?.value||loanerScanState.selectedStaff; const home_id=document.getElementById('loaner-home-sel')?.value;
    if(!staff_id){loanerScanState.sessionLog.push({id,name:'—',msg:'Select a staff member first',error:true});renderLoanerSessionLog();document.getElementById('loaner-scan-input')?.focus();return;}
    if(!home_id){loanerScanState.sessionLog.push({id,name:'—',msg:'Select a home first',error:true});renderLoanerSessionLog();document.getElementById('loaner-scan-input')?.focus();return;}
    loanerScanState.selectedStaff=staff_id;
    try{const r=await fetch(`/api/loaner/${encodeURIComponent(id)}/deploy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({staff_id:parseInt(staff_id),home_id:parseInt(home_id)})});const data=await r.json();if(r.ok)loanerScanState.sessionLog.push({id,name:data.item,msg:`Deployed to ${data.home} by ${data.staff}`,error:false});else loanerScanState.sessionLog.push({id,name:'—',msg:data.error,error:true});}catch(e){loanerScanState.sessionLog.push({id,name:'—',msg:'Connection error',error:true});}
  }else{
    try{const r=await fetch(`/api/loaner/${encodeURIComponent(id)}/retrieve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes:''})});const data=await r.json();if(r.ok)loanerScanState.sessionLog.push({id,name:data.item,msg:`Retrieved from ${data.home}`,error:false});else loanerScanState.sessionLog.push({id,name:'—',msg:data.error,error:true});}catch(e){loanerScanState.sessionLog.push({id,name:'—',msg:'Connection error',error:true});}
  }
  renderLoanerSessionLog(); document.getElementById('loaner-scan-input')?.focus();
}
function renderLoanerSessionLog() {
  const log=loanerScanState.sessionLog; if(!log.length)return; const errors=log.filter(l=>l.error).length;
  let html=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div class="card-title" style="margin-bottom:0">This session</div><div style="display:flex;gap:6px"><span class="badge badge-count">${log.length} scanned</span>${errors?`<span class="badge badge-out">${errors} errors</span>`:''}</div></div>`;
  [...log].reverse().forEach(l=>{html+=`<div class="row"><div class="row-main"><div class="row-title"><span class="tag">${l.id}</span>${l.name&&l.name!=='—'?' · '+l.name:''}</div><div class="row-sub" style="color:${l.error?'var(--coral)':'var(--gray-400)'}">${l.msg}</div></div><span class="badge ${l.error?'badge-out':loanerScanState.mode==='out'?'badge-out':'badge-in'}">${l.error?'Error':loanerScanState.mode==='out'?'Out':'In'}</span></div>`;});
  html+='</div>'; const el=document.getElementById('loaner-session-log'); if(el)el.innerHTML=html;
}

  const loaners=await fetch('/api/loaners').then(r=>r.json());

  let html=`<div class="stat-grid"><div class="stat"><div class="stat-num">${loaners.length}</div><div class="stat-lbl">Total items</div></div><div class="stat"><div class="stat-num" style="color:var(--coral)">${out.length}</div><div class="stat-lbl">Deployed</div></div><div class="stat"><div class="stat-num" style="color:var(--teal)">${inW.length}</div><div class="stat-lbl">At warehouse</div></div></div>`;
  if(out.length){html+='<div class="card"><div class="card-title">Currently deployed</div>';out.forEach(l=>{const since=l.deployed_at?new Date(l.deployed_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';html+=`<div class="row"><div class="row-main"><div class="row-title">${l.name} <span class="tag">${l.id}</span></div><div class="row-sub">${l.home_name}${l.staff_name?' · '+l.staff_name:''}${since?' · since '+since:''}</div></div><span class="badge badge-out">Out</span></div>`;});html+='</div>';}
  if(inW.length){html+='<div class="card"><div class="card-title">At warehouse</div>';const cats={};inW.forEach(l=>{if(!cats[l.category])cats[l.category]=[];cats[l.category].push(l);});Object.entries(cats).sort().forEach(([cat,items])=>{html+=`<div style="font-size:12px;font-weight:500;color:var(--gray-400);margin:8px 0 4px">${cat}</div>`;items.forEach(l=>{html+=`<div class="row"><div class="row-main"><div class="row-title">${l.name} <span class="tag">${l.id}</span></div></div><span class="badge badge-in">In</span></div>`;});});html+='</div>';}
  document.getElementById('main-content').innerHTML=html;
}

async function submitSupplyTx() {
  const supplyId = document.getElementById('tx-supply-id').value;

let _countSession = null;
let _countScanBuffer = '';

async function renderInventoryCount() {
  const pastRes = await fetch('/api/inventory-counts');
  const pastCounts = await pastRes.json();
  if (_countSession) { renderCountInProgress(); return; }
  let pastHtml = '';
  if (pastCounts.length) {
    pastHtml = `<div class="card"><div class="card-title">Past counts</div>` +
      pastCounts.slice(0,10).map(c=>{
        const variances = c.variances || 0;
        return `<div class="row"><div class="row-main"><div class="row-title">${c.started_at} — ${c.areas}</div><div class="row-sub">${c.item_count} items · ${variances===0?'<span style="color:var(--green)">No variances</span>':`<span style="color:var(--coral-dark)">${variances} variance${variances!==1?'s':''}</span>`}</div></div><button class="btn btn-ghost btn-sm" onclick="viewPastCount(${c.id})">View</button></div>`;
      }).join('') + '</div>';
  }
  document.getElementById('main-content').innerHTML = `
    <div style="font-size:15px;font-weight:600;margin-bottom:1rem">📋 InventoryCentral</div>
    <div class="card">
      <div class="card-title">Start new count</div>
      <p style="font-size:13px;color:var(--gray-700);margin-bottom:1rem">Select which areas to count, then scan each item and enter the quantity you physically find.</p>
      <label style="margin-bottom:8px">Areas to count</label>
      <div id="count-area-loaners" class="count-area-card selected" onclick="toggleCountArea('loaners')">
        <input type="checkbox" checked id="chk-loaners">
        <div><div style="font-size:14px;font-weight:600">📦 Loaner items</div><div style="font-size:12px;color:var(--gray-400)">Scan each item to confirm it's physically present</div></div>
      </div>
      <div id="count-area-supplies" class="count-area-card selected" onclick="toggleCountArea('supplies')">
        <input type="checkbox" checked id="chk-supplies">
        <div><div style="font-size:14px;font-weight:600">🧰 Supplies</div><div style="font-size:12px;color:var(--gray-400)">Scan item QR, enter quantity on shelf</div></div>
      </div>
      <div style="margin-top:1rem"><button class="btn btn-primary btn-full" onclick="startCount()">Begin count</button></div>
    </div>
    ${pastHtml}`;
}

function toggleCountArea(area) {
  const card = document.getElementById('count-area-'+area);
  const chk = document.getElementById('chk-'+area);
  chk.checked = !chk.checked;
  card.classList.toggle('selected', chk.checked);
}

async function startCount() {
  const areas = [];
  if (document.getElementById('chk-loaners')?.checked) areas.push('loaners');
  if (document.getElementById('chk-supplies')?.checked) areas.push('supplies');
  if (!areas.length) { alert('Please select at least one area to count.'); return; }
  let items = [];
  if (areas.includes('loaners')) {
    const loaners = await fetch('/api/loaners').then(r=>r.json());
    loaners.forEach(l => items.push({ id:'L-'+l.id, label:l.name, tag:l.id, type:'loaner', expected: l.status==='in'?1:0, expectedLabel: l.status==='in'?'In warehouse':'Deployed out', category:l.category }));
  }
  if (areas.includes('supplies')) {
    const supplies = await fetch('/api/supplies').then(r=>r.json());
    supplies.forEach(s => items.push({ id:'S-'+s.id, label:s.name, tag:'supply-'+s.id, type:'supply', expected:s.quantity, expectedLabel:`${s.quantity} ${s.unit}`, unit:s.unit, category:s.category, supplyId:s.id }));
  }
  _countSession = { areas, items, startedAt: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}), counts:{} };
  renderCountInProgress();
}

function renderCountInProgress() {
  const s = _countSession;
  const total = s.items.length;
  const counted = Object.keys(s.counts).length;
  const pct = total ? Math.round(counted/total*100) : 0;
  let loanerItems = s.items.filter(i=>i.type==='loaner');
  let supplyItems = s.items.filter(i=>i.type==='supply');
  function itemRow(item) {
    const done = s.counts.hasOwnProperty(item.id);
    const countedQty = s.counts[item.id];
    let varianceHtml = '';
    if (done) {
      if (item.type==='loaner') { varianceHtml = countedQty===1 ? '<span class="variance-ok">✓ Found</span>' : '<span class="variance-neg">✗ Missing</span>'; }
      else { const diff = countedQty - item.expected; if (diff===0) varianceHtml = '<span class="variance-ok">✓ Match</span>'; else if (diff>0) varianceHtml = `<span class="variance-pos">+${diff} over</span>`; else varianceHtml = `<span class="variance-neg">${diff} short</span>`; }
    }
    const inputVal = done ? countedQty : '';
    return `<div class="count-row" id="crow-${item.id}">
      <div class="count-row-left"><div style="font-size:13px;font-weight:500">${item.label}</div><div style="font-size:11px;color:var(--gray-400)">Expected: ${item.expectedLabel} · <span class="tag" style="font-size:10px">${item.tag}</span></div></div>
      <div class="count-row-right">${varianceHtml}
        ${item.type==='loaner'
          ? `<button class="btn btn-sm ${done&&countedQty===1?'btn-primary':'btn-ghost'}" onclick="countLoaner('${item.id}',1)" style="${done&&countedQty===1?'background:var(--green)':''}">Found</button><button class="btn btn-sm ${done&&countedQty===0?'btn-danger':'btn-ghost'}" onclick="countLoaner('${item.id}',0)">Missing</button>`
          : `<input class="count-input" type="number" min="0" value="${inputVal}" placeholder="—" onchange="countSupply('${item.id}',this.value)" oninput="countSupply('${item.id}',this.value)">`}
      </div>
    </div>`;
  }
  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <div style="font-size:15px;font-weight:600">📋 InventoryCentral — Count in progress</div>
      <span class="badge badge-count">${counted}/${total} done</span>
    </div>
    <div class="card">
      <div class="count-progress"><div class="count-progress-bar" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--gray-400);margin-bottom:1rem">${pct}% complete · Started ${s.startedAt}</div>
      <div style="background:var(--gray-50);border:0.5px solid var(--gray-200);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:1rem">
        <label style="margin-bottom:4px">Quick scan — scan a QR code to jump to that item</label>
        <input type="text" id="count-scan-input" placeholder="Scan QR code here..." autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')processCountScan()" style="margin-bottom:0">
      </div>`;
  if (loanerItems.length) { html += `<div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-400);margin-bottom:8px">📦 Loaner Items</div>`; html += loanerItems.map(itemRow).join(''); }
  if (supplyItems.length) { html += `<div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-400);margin:12px 0 8px">🧰 Supplies</div>`; html += supplyItems.map(itemRow).join(''); }
  html += `<div style="display:flex;gap:8px;margin-top:1.25rem"><button class="btn btn-ghost" onclick="cancelCount()">Cancel count</button><button class="btn btn-primary btn-full" onclick="finalizeCount()">Finalize & generate report</button></div></div>`;
  document.getElementById('main-content').innerHTML = html;
  document.getElementById('count-scan-input')?.focus();
}

function countLoaner(itemId, found) { _countSession.counts[itemId] = found; renderCountInProgress(); document.getElementById('count-scan-input')?.focus(); }
function countSupply(itemId, val) { const qty = parseInt(val); if (!isNaN(qty) && qty >= 0) _countSession.counts[itemId] = qty; else delete _countSession.counts[itemId]; }

function processCountScan() {
  const input = document.getElementById('count-scan-input');
  let raw = (input?.value||'').trim(); input.value = '';
  const supplyMatch = raw.match(/[?&][Ss][Uu][Pp][Pp][Ll][Yy]=(\d+)/);
  const loanerMatch = raw.match(/[?&][Ll][Oo][Aa][Nn][Ee][Rr]=([A-Za-z0-9-]+)/i);
  let found = false;
  if (supplyMatch) {
    const sid = 'S-'+supplyMatch[1]; const el = document.getElementById('crow-'+sid);
    if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='var(--teal-light)'; setTimeout(()=>el.style.background='',1500); found=true; el.querySelector('.count-input')?.focus(); }
  } else if (loanerMatch) {
    const lid = 'L-'+loanerMatch[1].toUpperCase(); const el = document.getElementById('crow-'+lid);
    if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='var(--teal-light)'; setTimeout(()=>el.style.background='',1500); found=true; }
  } else if (raw) {
    const item = _countSession.items.find(i=>i.tag.toUpperCase()===raw.toUpperCase());
    if (item) { const el=document.getElementById('crow-'+item.id); if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='var(--teal-light)';setTimeout(()=>el.style.background='',1500);found=true;if(item.type==='loaner')countLoaner(item.id,1);} }
  }
  if (!found && raw) {
    const flash = document.createElement('div');
    flash.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--coral-light);color:var(--coral-dark);padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999';
    flash.textContent='Item not found in this count'; document.body.appendChild(flash); setTimeout(()=>flash.remove(),2000);
  }
  setTimeout(()=>document.getElementById('count-scan-input')?.focus(), 100);
}

function cancelCount() { if (!confirm('Cancel this count? Progress will be lost.')) return; _countSession = null; renderInventoryCount(); }

async function finalizeCount() {
  const s = _countSession;
  if (!s) return;
  const variances = []; let matchCount = 0;
  s.items.forEach(item => {
    const counted = s.counts.hasOwnProperty(item.id) ? s.counts[item.id] : null;
    if (item.type === 'loaner') {
      if (counted === null || counted === 0) variances.push({ label:item.label, type:'loaner', expectedLabel:item.expectedLabel, counted:'Missing' });
      else matchCount++;
    } else {
      if (counted === null) variances.push({ label:item.label, type:'supply', expected:item.expected, counted:0, diff:-item.expected, unit:item.unit, missing:true });
      else { const diff=counted-item.expected; if(diff!==0)variances.push({label:item.label,type:'supply',expected:item.expected,counted,diff,unit:item.unit}); else matchCount++; }
    }
  });
  const totalCounted = s.items.length;
  const payload = { areas:s.areas.join(', '), started_at:s.startedAt, item_count:totalCounted, variances:variances.length, details:JSON.stringify({counts:s.counts,items:s.items,variances}) };
  try {
    const res = await fetch('/api/inventory-counts', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const saved = await res.json();
    _countSession = null;
    renderCountReport({...payload, variances_list:variances, matchCount, totalCounted, id:saved.id});
  } catch(e) { alert('Error saving count — please try again.'); console.error(e); }
}

function renderCountReport(data) {
  const v = data.variances_list || [];
  const shorts = v.filter(x=>x.diff<0||x.counted==='Missing');
  const overs = v.filter(x=>x.diff>0);
  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
      <div style="font-size:15px;font-weight:600">📋 Count Report — ${data.started_at}</div>
      <button class="btn btn-primary btn-sm" onclick="emailCountReport(${data.id})">📧 Email to accounting</button>
    </div>
    <div class="report-stat-grid">
      <div class="report-stat" style="background:var(--gray-50);border:0.5px solid var(--gray-200)"><div class="rnum">${data.totalCounted}</div><div class="rlbl" style="color:var(--gray-400)">Counted</div></div>
      <div class="report-stat" style="background:var(--green-light)"><div class="rnum" style="color:var(--green)">${data.matchCount}</div><div class="rlbl" style="color:var(--green)">Match</div></div>
      <div class="report-stat" style="background:var(--coral-light)"><div class="rnum" style="color:var(--coral-dark)">${shorts.length}</div><div class="rlbl" style="color:var(--coral-dark)">Short/missing</div></div>
      <div class="report-stat" style="background:var(--amber-light)"><div class="rnum" style="color:var(--amber)">${overs.length}</div><div class="rlbl" style="color:var(--amber)">Over count</div></div>
    </div>`;
  if (v.length) {
    html += `<div class="card"><div class="card-title" style="color:var(--coral-dark)">⚠️ Variances (${v.length})</div>`;
    v.forEach(item => {
      const isShort = item.diff<0||item.counted==='Missing'; const isOver = item.diff>0;
      let detail = '';
      if (item.type==='loaner') detail = item.counted==='Found'?'✓ Found':'✗ Missing — expected in warehouse';
      else { const diff=item.counted-item.expected; detail=`Found ${item.counted} ${item.unit||''} · expected ${item.expected} · <strong style="color:${diff<0?'var(--coral-dark)':'var(--amber)'}">${diff>0?'+':''}${diff}</strong>`; }
      html+=`<div class="row"><div class="row-main"><div class="row-title">${item.label} <span class="tag" style="font-size:10px">${item.type}</span></div><div class="row-sub">${detail}</div></div><span class="badge ${isShort?'badge-out':isOver?'badge-warn':'badge-ok'}">${isShort?'Short':'Over'}</span></div>`;
    });
    html += '</div>';
  } else {
    html += `<div class="card" style="text-align:center;padding:2rem"><div style="font-size:32px;margin-bottom:8px">✅</div><div style="font-size:15px;font-weight:600;color:var(--green)">Perfect count — no variances!</div></div>`;
  }
  html += `<div class="card"><div class="card-title">Full count detail</div>`;
  (data.items || []).forEach(item => {
    const counted = (data.counts||{})[item.id]; const done = counted !== undefined;
    let statusHtml = '<span style="color:var(--gray-400);font-size:12px">Not counted</span>';
    if (done) {
      if (item.type==='loaner') statusHtml = counted===1?'<span class="variance-ok">Found</span>':'<span class="variance-neg">Missing</span>';
      else { const diff=counted-item.expected; statusHtml=diff===0?'<span class="variance-ok">Match</span>':diff>0?`<span class="variance-pos">+${diff}</span>`:`<span class="variance-neg">${diff}</span>`; }
    }
    html+=`<div class="count-row"><div class="count-row-left"><div style="font-size:13px;font-weight:500">${item.label}</div><div style="font-size:11px;color:var(--gray-400)">Expected: ${item.expectedLabel}</div></div><div class="count-row-right"><span style="font-size:13px;font-weight:600">${done?(item.type==='loaner'?counted===1?'1 found':'Missing':counted+' '+item.unit):'—'}</span>${statusHtml}</div></div>`;
  });
  html += '</div>';
  html += `<div style="margin-top:1rem"><button class="btn btn-ghost" onclick="renderInventoryCount()">← Back to counts</button></div>`;
  document.getElementById('main-content').innerHTML = html;
}

async function viewPastCount(countId) {

}

async function emailCountReport(countId) {

function openReceiveModal(orderId) {
  fetch(`/api/orders/${orderId}`).then(r=>r.json()).then(order => {

      <div class="count-row" style="flex-wrap:wrap;gap:6px">

async function submitReceiveOrder(orderId) {
  const receivedBy = document.getElementById('recv-by')?.value?.trim();
  if (!receivedBy) { alert('Please enter your name.'); return; }
  const order = await fetch(`/api/orders/${orderId}`).then(r=>r.json());
  const items = order.items.map(it => ({
    id: it.id,
    received_units: parseInt(document.getElementById(`recv-${it.id}`)?.value || it.expected_units),
    notes: document.getElementById(`recv-note-${it.id}`)?.value?.trim() || ''
  }));
  const orderNotes = document.getElementById('recv-order-notes')?.value?.trim() || '';
  const res = await fetch(`/api/orders/${orderId}/receive`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ received_by: receivedBy, notes: orderNotes, items })
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('modal-receive-order')?.remove();
  if (data.has_discrepancy) {
    alert("⚠️ Order received, but some quantities didn't match what was expected. This has been flagged for review.");
  } else {
    alert('✅ Order received! Inventory has been updated.');
  }
  renderPendingOrders();
}

      <div id="place-order-msg" style="margin-top:10px;font-size:13px;color:var(--teal);text-align:center;min-height:18px"></div>
    </div>`;
  renderOrderItemRows();
}

function renderOrderItemRows() {
  const list = document.getElementById('order-items-list');
  if (!list) return;
  const items = window._orderInventoryItems || [];
  list.innerHTML = _placeOrderItems.map((row, idx) => {
    const expected = (parseFloat(row.cases_ordered)||0) * (parseFloat(row.units_per_case)||0);
    return `<div class="card" style="background:var(--gray-50);margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="card-title" style="margin-bottom:0">Item ${idx+1}</div>
        ${_placeOrderItems.length>1?`<button class="btn btn-ghost btn-sm" onclick="removeOrderItemRow(${idx})">Remove</button>`:''}
      </div>
      <label>Match to existing item (optional)</label>
      <select onchange="onOrderItemMatch(${idx}, this.value)">
        <option value="">— New / unmatched item —</option>
        ${items.map(it=>`<option value="${it.id}" ${row.matched_supply_id==it.id?'selected':''}>${it.name} (${it.unit})</option>`).join('')}
      </select>
      <label>Item name</label>
      <input type="text" value="${row.item_name}" oninput="updateOrderItem(${idx},'item_name',this.value)" placeholder="e.g. Palmolive Dish Soap 3oz">
      <div class="form-row">
        <div><label>Cases/packs ordered</label><input type="number" min="0" step="1" value="${row.cases_ordered}" oninput="updateOrderItem(${idx},'cases_ordered',this.value)"></div>
        <div><label>Units per case</label><input type="number" min="0" step="1" value="${row.units_per_case}" oninput="updateOrderItem(${idx},'units_per_case',this.value)"></div>
      </div>
      <div class="form-row">
        <div><label>Unit label</label><input type="text" value="${row.unit_label}" oninput="updateOrderItem(${idx},'unit_label',this.value)" placeholder="e.g. rolls, bottles"></div>
        <div><label>Price (optional)</label><input type="number" min="0" step="0.01" value="${row.price}" oninput="updateOrderItem(${idx},'price',this.value)" placeholder="$0.00"></div>
      </div>
      <div style="font-size:13px;font-weight:600;color:var(--teal-dark);background:var(--teal-light);padding:8px 12px;border-radius:var(--radius-sm)">
        = ${expected || 0} ${row.unit_label || 'units'} expected
      </div>
    </div>`;
  }).join('');
}

function addOrderItemRow() {
  _placeOrderItems.push({ item_name:'', matched_supply_id:'', cases_ordered:1, units_per_case:1, unit_label:'units', price:'' });
  renderOrderItemRows();
}
function removeOrderItemRow(idx) {
  _placeOrderItems.splice(idx,1);
  renderOrderItemRows();
}
function updateOrderItem(idx, field, value) {
  _placeOrderItems[idx][field] = value;
  renderOrderItemRows();
}
function onOrderItemMatch(idx, supplyId) {
  _placeOrderItems[idx].matched_supply_id = supplyId;
  if (supplyId) {
    const item = (window._orderInventoryItems||[]).find(i=>i.id==supplyId);
    if (item) {
      _placeOrderItems[idx].item_name = item.name;
      _placeOrderItems[idx].unit_label = item.unit;
    }
  }
  renderOrderItemRows();
}


function onVendorSelect(val) {
  const custom = document.getElementById('po-vendor');
  if (!custom) return;
  if (val === '__other__') {
    custom.style.display = 'block';
    custom.focus();
  } else {
    custom.style.display = 'none';
    custom.value = val;
  }
}
async function submitPlaceOrder() {
  const orderedBy = document.getElementById('po-ordered-by')?.value?.trim();
  const vendorSel = document.getElementById('po-vendor-select')?.value;
  const vendor = vendorSel === '__other__'
    ? document.getElementById('po-vendor')?.value?.trim()
    : vendorSel || document.getElementById('po-vendor')?.value?.trim();
  const notes = document.getElementById('po-order-notes')?.value?.trim();
  if (!orderedBy) { alert('Please enter who is placing this order.'); return; }
  const validItems = _placeOrderItems.filter(it => it.item_name.trim());
  if (!validItems.length) { alert('Please add at least one item.'); return; }

  const payload = {
    module: _ordersModuleFilter,
    ordered_by: orderedBy,
    vendor, notes,
    items: validItems.map(it => ({
      item_name: it.item_name.trim(),
      matched_supply_id: it.matched_supply_id ? parseInt(it.matched_supply_id) : null,
      cases_ordered: parseFloat(it.cases_ordered) || 1,
      units_per_case: parseFloat(it.units_per_case) || 1,
      unit_label: it.unit_label.trim() || 'units',
      price: it.price ? parseFloat(it.price) : null
    }))
  };

  const res = await fetch('/api/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

  document.getElementById('place-order-msg').textContent = '✅ Order placed! It will show under Pending until received.';
  _placeOrderItems = [];
  document.getElementById('po-ordered-by').value = '';
  document.getElementById('po-vendor').value = '';
  document.getElementById('po-order-notes').value = '';
  setTimeout(() => ordersSubtab('pending'), 1200);
}

async function renderOrderHistory() {
  const body = document.getElementById('orders-body');

  body.innerHTML = orders.map(o => {
    const date = new Date(o.ordered_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const recvDate = o.received_at ? new Date(o.received_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : null;
    return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:14px;font-weight:600">${o.vendor || 'Order'} #${o.id}</div>
        <span class="badge ${o.status==='Received'?(o.has_discrepancy?'badge-warn':'badge-ok'):'badge-warn'}">${o.status}${o.has_discrepancy?' ⚠️':''}</span>
      </div>
      <div style="font-size:12px;color:var(--gray-400);margin-bottom:8px">Ordered by ${o.ordered_by} · ${date}${recvDate?` · Received ${recvDate} by ${o.received_by}`:''}</div>

// ── Discrepancies ────────────────────────────────────────────────────────────

async function renderDiscrepancies() {
  const body = document.getElementById('orders-body');
  body.innerHTML = '<div class="card">Loading...</div>';
  const orders = await fetch(`/api/orders?module=${_ordersModuleFilter}`).then(r=>r.json());
  const withDiscrepancy = orders.filter(o => o.has_discrepancy);
  if (!withDiscrepancy.length) {
    body.innerHTML = '<div class="empty">✅ No discrepancies — everything has matched so far.</div>';
    return;
  }
  body.innerHTML = withDiscrepancy.map(o => {
    const mismatched = o.items.filter(it => it.line_discrepancy);
    return `<div class="card" style="border-color:var(--coral);border-width:1.5px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:14px;font-weight:600">${o.vendor || 'Order'} #${o.id}</div>
        <span class="badge ${o.discrepancy_resolved?'badge-ok':'badge-out'}">${o.discrepancy_resolved?'Resolved':'Unresolved'}</span>
      </div>
      ${mismatched.map(it=>`<div class="row"><div class="row-main"><div class="row-title">${it.item_name}</div><div class="row-sub">Expected ${it.expected_units} ${it.unit_label} · Received ${it.received_units} ${it.unit_label}</div></div></div>`).join('')}
      ${o.discrepancy_notes?`<div style="font-size:12px;color:var(--gray-400);margin-top:8px"><em>Note: ${o.discrepancy_notes}</em></div>`:''}
      ${!o.discrepancy_resolved && role==='admin' ? `
        <div style="margin-top:10px;display:flex;gap:8px">
          <input type="text" id="resolve-note-${o.id}" placeholder="Resolution note (optional)" style="flex:1;margin-bottom:0">
          <button class="btn btn-primary btn-sm" onclick="resolveOrderDiscrepancy(${o.id})">Mark Resolved</button>
        </div>` : ''}
    </div>`;
  }).join('');
}

async function resolveOrderDiscrepancy(orderId) {
  const notes = document.getElementById(`resolve-note-${orderId}`)?.value?.trim() || '';
  await fetch(`/api/orders/${orderId}/resolve-discrepancy`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({notes}) });
  renderDiscrepancies();
}

let _checkoutType = 'loan';
function setCheckoutType(type) {
  _checkoutType = type;
  document.getElementById('co-type-loan').className = `btn ${type==='loan'?'btn-primary':'btn-ghost'}`;
  document.getElementById('co-type-sold').className = `btn ${type==='sold_out'?'btn-primary':'btn-ghost'}`;
  document.getElementById('co-return-date-row').style.display = type==='loan' ? 'block' : 'none';
}

function onStoreStaffSelect(sel) {
  const otherInput = document.getElementById('co-staff-other');
  const emailInput = document.getElementById('co-staff-email');
  if (sel.value === '__other__') {
    otherInput.style.display='block'; emailInput.style.display='block';
    otherInput.focus();
  } else {
    otherInput.style.display='none'; emailInput.style.display='none';
    const opt = sel.options[sel.selectedIndex];
    if (opt) emailInput.value = opt.dataset.email || '';
  }
}

async function submitStoreCheckout(itemId) {
  const property = document.getElementById('co-property')?.value?.trim();
  const qty = parseInt(document.getElementById('co-qty')?.value || 1);
  const staffSel = document.getElementById('co-staff')?.value;
  const staffOther = document.getElementById('co-staff-other')?.value?.trim();
  const staffEmail = document.getElementById('co-staff-email')?.value?.trim() ||
    document.getElementById('co-staff')?.options[document.getElementById('co-staff')?.selectedIndex]?.dataset?.email || '';
  const performedBy = staffSel === '__other__' ? staffOther : staffSel;
  const returnDate = document.getElementById('co-return-date')?.value;
  const notes = document.getElementById('co-notes')?.value?.trim();

  if (!property) { alert('Please enter a property address.'); return; }
  if (!performedBy) { alert('Please select who is checking this out.'); return; }
  if (_checkoutType === 'loan' && !returnDate) { alert('Please set an expected return date.'); return; }

  const btn = document.getElementById('co-submit-btn');
  btn.textContent = 'Submitting...'; btn.disabled = true;

  try {
    const res = await fetch('/api/store/checkout', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        item_id: itemId, quantity: qty, property_address: property,
        performed_by: performedBy, performed_by_email: staffEmail,
        transaction_type: _checkoutType,
        expected_return_date: returnDate || null, notes
      })
    });
    const data = await res.json();
    if (data.error) { alert(data.error); btn.textContent='Confirm Checkout'; btn.disabled=false; return; }
    document.getElementById('modal-store-checkout')?.remove();
    if (_checkoutType === 'sold_out') {
      alert('✅ Checked out as sold out. Accounting has been notified by email.');
    } else {
      alert(`✅ Checked out on loan. Expected return: ${returnDate}`);
    }
    const storeRes = await fetch('/api/store/items');
    _storeItems = await storeRes.json();
    renderStoreCards();
  } catch(e) {
    alert('Connection error.'); btn.textContent='Confirm Checkout'; btn.disabled=false;
  }
}

async function renderActiveLoans() {

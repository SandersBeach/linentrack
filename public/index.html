async function returnLoanItem(txId, itemName) {
  const notes = prompt(`Any notes about the return of "${itemName}"? (optional)`);

      <button class="btn btn-primary" onclick="saveStoreItem(${item?.id||'null'})">${isEdit?'Save':'Add Item'}</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function saveStoreItem(itemId) {
  const name = document.getElementById('si-name')?.value?.trim();
  const category = document.getElementById('si-category')?.value;
  const price = parseFloat(document.getElementById('si-price')?.value||0);
  const qty = parseInt(document.getElementById('si-qty')?.value||0);
  if (!name) { alert('Please enter an item name.'); return; }
  const isEdit = itemId !== null;
  const url = isEdit ? `/api/store/items/${itemId}` : '/api/store/items';
  const body = {pin:_currentPin, name, category, price};
  if (!isEdit) body.quantity = qty;
  const res = await fetch(url, {method:isEdit?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('modal-store-item')?.remove();
  const storeRes = await fetch('/api/store/items');
  _storeItems = await storeRes.json();
  renderStoreInventory();
}

function setForecastRange(days) {
  const from = new Date();
  const to = new Date();
  to.setDate(to.getDate() + days);
  document.getElementById('fc-from').value = from.toISOString().split('T')[0];
  document.getElementById('fc-to').value = to.toISOString().split('T')[0];
}
function clearForecastRange() {
  document.getElementById('fc-from').value = '';
  document.getElementById('fc-to').value = '';
}

async function runForecast() {
  const btn = document.getElementById('run-forecast-btn');
  btn.textContent = 'Calculating...'; btn.disabled = true;

  const from = document.getElementById('fc-from')?.value;
  const to = document.getElementById('fc-to')?.value;
  let url = '/api/forecast/run';
  if (from && to) url += `?from=${from}&to=${to}`;
  else if (from) url += `?from=${from}`;
  else if (to) url += `?to=${to}`;

  try {
    const data = await fetch(url).then(r=>r.json());
    renderForecastResults(data, from, to);
  } catch(e) {
    alert('Error running forecast — please try again.');
  } finally {
    btn.textContent = 'Run Forecast'; btn.disabled = false;
  }
}

function fcDragOver(e, zoneId) {
  e.preventDefault();
  const z = document.getElementById(zoneId);
  if (z) { z.style.borderColor='var(--teal)'; z.style.background='var(--teal-light)'; }
}
function fcDragLeave(zoneId) {
  const z = document.getElementById(zoneId);
  if (z) { z.style.borderColor='var(--gray-200)'; z.style.background=''; }
}
function fcDrop(e, inputId, zoneId, nameId) {
  e.preventDefault();
  fcDragLeave(zoneId);
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const input = document.getElementById(inputId);
  const dt = new DataTransfer();
  dt.items.add(file);
  input.files = dt.files;
  const nameEl = document.getElementById(nameId);
  if (nameEl) nameEl.textContent = '✓ ' + file.name;
  const zone = document.getElementById(zoneId);
  if (zone) { zone.style.borderColor='var(--teal)'; zone.style.borderStyle='solid'; }
}
function fcFileSelected(inputId, nameId) {
  const file = document.getElementById(inputId)?.files[0];
  const nameEl = document.getElementById(nameId);
  if (file && nameEl) nameEl.textContent = '✓ ' + file.name;
}

                  ? '<span style="color:var(--green);font-weight:600">✓ OK</span>'
                  : `<span style="color:var(--coral-dark);font-weight:600">-${ing.short}</span>`}
              </td>
            </tr>`).join('')}
          </table>
        </div>
      </div>`;

    body.innerHTML = html;
  } catch(e) {
    body.innerHTML = '<div class="empty">Error loading box packing data — make sure reservations and pack list are uploaded.</div>';
  }
}

function getPOFields(prefix) {
  const g = id => document.getElementById(prefix+id)?.value?.trim();
  return {
    employee_name: g('name'), employee_email: g('email'), vendor: g('vendor'),
    amount: g('amount'), category: g('category'), description: g('description'),
    date_needed: g('date'), urgency: g('urgency') || 'Routine'
  };
}
function validatePOFields(f) {
  if (!f.employee_name) { alert('Please enter your name.'); return false; }
  if (!f.employee_email || !f.employee_email.includes('@')) { alert('Please enter a valid email.'); return false; }
  if (!f.vendor) { alert('Please enter a vendor.'); return false; }
  if (!f.amount || isNaN(parseFloat(f.amount))) { alert('Please enter a valid amount.'); return false; }
  if (!f.category) { alert('Please select a category.'); return false; }
  if (!f.description) { alert('Please describe what you need.'); return false; }
  if (!f.date_needed) { alert('Please enter the date needed by.'); return false; }
  return true;
}

<script>
// Staff management functions (appended)
let _pinsVisible = false;

async function togglePinsVisible() {
  _pinsVisible = !_pinsVisible;
  const btn = document.getElementById('toggle-pins-btn');
  if (btn) btn.textContent = _pinsVisible ? '🙈 Hide PINs' : '👁️ Show PINs';
  loadStaffList();
}

async function loadStaffList() {
  const area = document.getElementById('staff-list-area');
  if (!area) return;
  area.innerHTML = 'Loading...';
  let staff;
  if (_pinsVisible) {
    const res = await fetch('/api/staff/reveal', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({admin_pin:_currentPin}) });
    const data = await res.json();
    if (data.error) { alert(data.error); _pinsVisible = false; const btn=document.getElementById('toggle-pins-btn'); if(btn) btn.textContent='👁️ Show PINs'; staff = await fetch('/api/staff').then(r=>r.json()); }
    else { staff = data; }
  } else {
    staff = await fetch('/api/staff').then(r=>r.json());
  }
  if (!staff.length) { area.innerHTML = '<div class="empty">No staff members found. Click Reset to Master List to seed.</div>'; return; }
  const roles = [...new Set(staff.map(s=>s.role))].sort();
  area.innerHTML = roles.map(role => `
    <div style="margin-bottom:1rem">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-400);margin-bottom:6px">${role}</div>
      ${staff.filter(s=>s.role===role).map(s=>`
        <div class="row" style="align-items:center">
          <div class="row-main">
            <div class="row-title" style="font-size:13px">${s.name} ${!s.active?'<span style="color:var(--coral-dark);font-size:11px">(inactive)</span>':''}</div>
            <div class="row-sub">${s.email||'no email'} · PIN: ${_pinsVisible && s.pin ? `<strong style="font-family:monospace;letter-spacing:2px;color:var(--teal-dark)">${s.pin}</strong>` : '****'}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="showEditStaffModal(${s.id},'${s.name.replace(/'/g,"\\'")}','${s.role}','${s.email||''}',${s.active})">Edit</button>
        </div>`).join('')}
    </div>`).join('');
}

function showAddStaffModal() {
  const modal = document.createElement('div');
  modal.className='modal-overlay'; modal.id='modal-staff';
  modal.innerHTML=`<div class="modal-box" style="max-width:400px">
    <h3>Add Staff Member</h3>
    <label>Full name</label><input type="text" id="sm-name" placeholder="e.g. Jane Smith">
    <label style="margin-top:0.75rem">Role</label>
    <select id="sm-role">
      <option value="warehouse">Warehouse</option>
      <option value="maintenance">Maintenance</option>
      <option value="inspector">Inspector</option>
      <option value="coordinator">Coordinator</option>
      <option value="admin">Admin</option>
    </select>
    <label style="margin-top:0.75rem">PIN (4 digits)</label>
    <input type="text" id="sm-pin" maxlength="4" placeholder="e.g. 1234">
    <label style="margin-top:0.75rem">Email (for alerts)</label>
    <input type="email" id="sm-email" placeholder="e.g. jane@sandersbeachrentals.com">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-staff').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddStaff()">Add Staff Member</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function submitAddStaff() {
  const name=document.getElementById('sm-name')?.value?.trim();
  const role=document.getElementById('sm-role')?.value;
  const pin=document.getElementById('sm-pin')?.value?.trim();
  const email=document.getElementById('sm-email')?.value?.trim();
  if(!name||!pin){alert('Name and PIN are required.');return;}
  if(pin.length!==4||!/^\d+$/.test(pin)){alert('PIN must be exactly 4 digits.');return;}
  const res=await fetch('/api/staff',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({admin_pin:_currentPin,name,role,pin,email})});
  const data=await res.json();
  if(data.error){alert(data.error);return;}
  document.getElementById('modal-staff')?.remove();
  loadStaffList();
}

function showEditStaffModal(id, name, role, email, active) {
  const modal = document.createElement('div');
  modal.className='modal-overlay'; modal.id='modal-staff-edit';
  modal.innerHTML=`<div class="modal-box" style="max-width:400px">
    <h3>Edit: ${name}</h3>
    <label>New PIN (leave blank to keep current)</label>
    <input type="text" id="se-pin" maxlength="4" placeholder="4 digits">
    <label style="margin-top:0.75rem">Email</label>
    <input type="email" id="se-email" value="${email}">
    <label style="margin-top:0.75rem">Role</label>
    <select id="se-role">
      <option value="warehouse" ${role==='warehouse'?'selected':''}>Warehouse</option>
      <option value="maintenance" ${role==='maintenance'?'selected':''}>Maintenance</option>
      <option value="inspector" ${role==='inspector'?'selected':''}>Inspector</option>
      <option value="coordinator" ${role==='coordinator'?'selected':''}>Coordinator</option>
      <option value="admin" ${role==='admin'?'selected':''}>Admin</option>
    </select>
    <label style="margin-top:0.75rem">Status</label>
    <select id="se-active">
      <option value="1" ${active?'selected':''}>Active</option>
      <option value="0" ${!active?'selected':''}>Inactive</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-staff-edit').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEditStaff(${id})">Save Changes</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function submitEditStaff(id) {
  const pin=document.getElementById('se-pin')?.value?.trim();
  const email=document.getElementById('se-email')?.value?.trim();
  const role=document.getElementById('se-role')?.value;
  const active=parseInt(document.getElementById('se-active')?.value);
  if(pin&&(pin.length!==4||!/^\d+$/.test(pin))){alert('PIN must be 4 digits.');return;}
  const body={admin_pin:_currentPin,email,role,active};
  if(pin) body.pin=pin;
  const res=await fetch(`/api/staff/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(data.error){alert(data.error);return;}
  document.getElementById('modal-staff-edit')?.remove();
  loadStaffList();
}

async function seedStaffMembers() {
  if(!confirm('This will reset ALL staff PINs to the master list. Continue?'))return;
  const btn=event.target; btn.textContent='Resetting...'; btn.disabled=true;
  const res=await fetch('/api/seed-staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:_currentPin})});
  const data=await res.json();
  if(data.error){alert(data.error);btn.textContent='🔄 Reset to Master List';btn.disabled=false;return;}
  document.getElementById('seed-staff-msg').textContent=`✓ ${data.inserted} staff members loaded.`;
  btn.textContent='🔄 Reset to Master List';btn.disabled=false;
  loadStaffList();
}
</script>
